# Alpha 0.1 match lifecycle.
#
# The template is the frozen Consolidative world (docs/analysis/alpha-0.1-map-freeze.json).
# A match runs on a disposable copy named by instanceWorldName; reset replaces
# that copy from the template rather than rolling back blocks (ALPHA-D2).
alpha:
  # Repo-relative works when the server runs inside the repository; it is also
  # searched against the server directory, the plugin data folder and their
  # ancestors. A server deployed outside the repository must give an ABSOLUTE
  # path here -- the template is the frozen authority and is never copied.
  # The BASE terrain. A match's map is a copy of this with one authored
  # configuration applied, so this is pristine ground and holds no authored
  # structures at all. deploy.sh rewrites the path for the running server.
  templatePath: artifacts/worldgen/alpha-0.1/base-terrain
  # Map configurations: each is every block that configuration changes about the
  # base, exported by terrain_harvest.map_diff. A configuration is a 300KB file
  # rather than a 28MB world, so a second one costs nothing to add, and every
  # structure stays defined once -- in the Python authoring, where the terrain
  # analysis lives.
  #
  # One is drawn at random per match, from a catalogue whose members were each
  # authored and measured offline. Set `force` to pin one for a controlled test.
  configurations:
    enabled: true
    directory: maps
    include:
      # Re-authored 2026-09-22: terrain-fitted Routes, and regenerative
      # opportunities recorded but not built. Same base terrain, different
      # opportunity layouts -- 10 worksites / 8 renewables against 8 / 6, and
      # only 8 of their placement positions in common.
      - consolidative_v2
      - resource_light_v2
      # The frozen maps, kept as controls: their Routes are the ones with a jump
      # every two and a half columns and their pens and fields are still built,
      # which is worth being able to walk rather than only remember.
      - consolidative
      - resource_light
    force: ""
  instanceWorldName: alpha_match
  # Reusable debug scoops, isolated from the consumable production pool.
  lab:
    # Chamber bays, cut from the launched scoop.
    #
    # 33 x 21 x 33 at radius 16. Deliberately inside LabUndo's 120,000-block
    # journal, so regenerating a bay stays undoable; a larger radius would put
    # it out of reach and that is a decision rather than an accident.
    chamber:
      radius: 16
      height: 20
      floor: 60
    mapsDirectory: lab-maps
    roomWorldName: moba_lab
    instanceWorldName: moba_lab_match
  # Homeland spawn per team, [x, z] or [x, z, y].
  #
  # These are inside the Aether Fountain basin, not on the terrain near it. A
  # player spawning on bare ground could not tell where they were; spawning in
  # the Fountain makes the thing their team loses when it is disabled the first
  # thing they stand in. The y is explicit because the fountain's own centre is
  # a solid column, so the highest block there is not standable.
  homelands:
    north: [-2173, -461, 74]
    south: [-2005, 411, 76]

  # The READY map pool the foundry writes into.
  #
  # DISABLED BY DEFAULT. With the pool off, every match runs on the frozen
  # Consolidative template, which is the current known-good behaviour. Turning
  # it on means match start claims a previously compiled, verified, unused map
  # instead -- and falls back to the template with a message when the pool is
  # empty, because an empty pool is an operational state (the foundry has not
  # run recently enough), not an error.
  #
  # Populate it offline with:
  #   python3 -m terrain_harvest.foundry --pool <dir> --candidate <candidate.json>
  # A map is only published if it compiled, authored and verified, so claiming
  # is unconditional: everything in the pool already passed.
  pool:
    enabled: true
    directory: /private/tmp/mobapool
    # Play on a realization that cannot satisfy the runtime contract.
    #
    # OFF, and it should stay off. With the pool empty the selection falls back
    # to the configured template, and this template's `alpha.lair.site` is
    # EMPTY BY DESIGN -- so the fallback produced a match whose Lair reported
    # UNCONFIGURED and whose three Lair nights did nothing. That is the exact
    # state the READY contract exists to prevent, reached by the one path that
    # does not go through it.
    #
    # Selection now certifies what was BOUND rather than where it came from,
    # and refuses. This key exists so deliberate partial testing stays possible
    # without reinstating a silent fallback: the difference that matters is
    # that someone had to write it down. It logs loudly when set.
    allowIncompleteBinding: false

  # The single permanent Giant Monster Lair: one site for the whole match, its
  # occupant succeeding Giant -> Ghast -> Ender Dragon on Lair nights.
  #
  # EMPTY BY DESIGN. No map in this repository has a certified Lair socket yet:
  # socket search wants encounter volume, vertical room, several practical
  # approaches, landmark readability and near-equal initial reach from both
  # teams, and none of that has been measured on the Alpha map. The runtime
  # therefore reports lair=UNBOUND rather than picking the coordinate centre or
  # flattening a stadium, because an invented site would be a silent design
  # decision about the one place where team access parity genuinely matters.
  #
  # Set to [x, y, z] to bind a socket.
  lair:
    site: []

  worksites:
    # Positions are the frozen Consolidative Alpha map's own mining_worksite
    # placements (docs/analysis/alpha-0.1-map-freeze.json), not invented sites.
    #
    # activationsPerTier is a NON-CANON ANALYTICAL FIXTURE. objectives.md says
    # the number of simultaneously active Worksites "depends on match phase" but
    # does not supply the series, so it is declared here rather than guessed in
    # code.
    #
    # "Phase" is now the Worksite TIER. Worksites open on the Worksite nights of
    # the alternating cadence -- I, II, III at nights 1, 3 and 5 -- and not on
    # the Lair nights between them. The superseded activationsPerSunset list was
    # indexed by sunset ordinal, which assumed every sunset was a Worksite
    # sunset and repeated its last entry for the rest of the match. It is still
    # honoured if present, with a deprecation warning, so an existing server
    # does not change behaviour silently.
    #
    # Sunset activates; SUNRISE CLOSES NOTHING. Activation is permanent
    # (objectives.md 17C, 23 September 2026), so Worksite geography accumulates
    # over the match: a tier III night does not retire the tier I sites. There
    # is deliberately no deactivation or expiry key here to set.
    #
    # The tier's economic IDENTITY is fixed in code, on
    # OpportunityCadence.WorksiteTier, because it is doctrine rather than a
    # deployment choice:
    #
    #   I   Iron + Coal              / Blast Furnace + Smoker
    #   II  Diamond + Lapis          / Enchanting Table
    #   III Ancient Debris + Diamond / Smithing Table
    #
    # The physical PACKAGE is NOT configured here and is not granted. Every
    # quantity -- iron, coal, diamond, lapis, ancient debris, the secondary
    # tier III diamond, factory throughput and supply thresholds -- is OPEN,
    # and the existing Mining Outpost / Industrial Enchanter work is the
    # specific form. The runtime records the tier and its identity and reports
    # the physical package as unresolved. Do not add quantities here to make
    # the seam look finished.
    activationsPerTier:
      I: 2
      II: 2
      III: 3
    # 0 means a fresh Random each run; set non-zero for reproducible activation.
    randomSeed: 0
    sites:
      - id: ws_0_0
        xyz: [-2416, 74, -464]
        bias: north
      - id: ws_0_5
        xyz: [-2384, 98, 144]
        bias: neutral
      - id: ws_0_6
        xyz: [-2384, 94, 272]
        bias: south
      - id: ws_1_2
