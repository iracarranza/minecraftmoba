# Feature flags. Each Phase 2 feature is independently switchable; turning one
# off must never require touching another.
features:
  # No friendly fire, as ONE rule in one place.
  #
  # [RESOLVED 27 September 2026] It means no AUTHORED damage across teams,
  # while incidental and systemic damage still applies: TNT, suffocation and
  # the like do hit allies. Sinkhole's restore-suffocation keeps its
  # positioning cost for the caster's own team, and Toolbox's dispensed TNT
  # is not made safe for teammates.
  #
  # Implemented as an ALLOW-LIST of authored causes rather than a deny-list
  # of incidental ones, so a cause Minecraft adds later is systemic by
  # default -- which is the safe direction to fail in.
  noFriendlyFire:
    enabled: true
  # Settings you hold, in the one place holding things is free.
  #
  # The lobby carries no MOBA state at all -- no offhand map, no locked slots,
  # no vitals, no progression readout -- so the inventory there is the
  # player's own and has room for something that is not a menu. An immovable
  # item is visible WITHOUT being opened, which a chest GUI is not.
  #
  # Each slot is one setting, clicked to cycle. Adding a second setting is
  # adding a slot, which is what keeps this from growing into a menu.
  lobbySettings:
    enabled: true
    castModeSlot: 8
  # The targeting preview, drawn to the CASTING PLAYER ONLY.
  #
  # Player.spawnParticle sends to one player; World.spawnParticle sends to
  # everyone. That one call is the whole of "opponents do not see the
  # indicator" -- a preview is pre-commitment information in a way a cast is
  # not, and under Double cast it can be feinted for free, so showing it to an
  # opponent would make aiming a liability.
  #
  # Occluded blocks are marked anyway. The preview's job is to say WHICH
  # BLOCKS, not to be a picture, and a tunnelling run that vanished where it
  # entered the hill would answer worst exactly where the ability is opaque.
  targetPreview:
    enabled: true
    particle: END_ROD
    # One mark per block at its centre, not an outline: twelve edges per block
    # turns a twenty-block run into a haze, while centres stay countable.
    perBlock: 1
    cadenceTicks: 4
  # Team-coloured GROUND inside each objective and Fountain volume.
  #
  # The glowing box cannot be read from inside it, and the ground around an
  # objective is exactly where a defender stands -- so the volume stays and the
  # representation changes. Minecraft already tints terrain per biome, which is
  # why a swamp does not look like a jungle, so this recolours by swapping the
  # biome rather than inventing a rendering path.
  #
  # The two tints are drawn from biomes the MAP DOES NOT CONTAIN, surveyed at
  # bind time: contrast has to be a property of the map rather than a guess, and
  # a tint matching nearby terrain communicates nothing. If fewer than two
  # candidates are free the feature declines rather than picking a colliding
  # colour.
  #
  # Only biome-tinted blocks change: grass, ferns, leaves, vines, sugar cane,
  # water. Dirt, stone and wood never will. Biome cells are 4x4x4, so the edge
  # snaps to a four-block grid.
  #
  # [OPEN] Biome carries mob spawns, weather and ambience, so this silently
  # changes what spawns on tinted ground. Absent biomes confine that rather than
  # removing it; a datapack biome overriding only colours, or per-viewer biome
  # packets, would remove it properly. OFF until that is resolved.
  objectiveTint:
    enabled: false
    # How far AROUND EACH VOLUME to survey, not a map-wide sweep. The tint has
    # to contrast with the terrain beside it; a biome 500 blocks away has no
    # bearing on whether an objective's ground reads as claimed. The first
    # version swept the whole map and forced thousands of synchronous chunk
    # loads, which stalled the server hard enough for Paper to dump threads.
    surveyRadius: 64
  # A team-coloured glow around each defensive objective and Aether Fountain,
  # so a player can tell by looking that they are one team system.
  #
  # Raised from the first live playtest: an authored Pillager Outpost read as
  # scenery, with nothing saying whose it was or that it was contestable.
  #
  # The body is a clear-glass block display scaled past the structure, because
  # the glow is traced from what the model RENDERS -- a display carrying an
  # invisible block produces no outline at all, so there is no
  # invisible-but-outlined form to configure. A purpose-built wireframe item
  # model is the intended successor.
  #
  # Colours are ChatColor names, because the glow resolves through a scoreboard
  # team and that is the palette a team colour has. Arbitrary RGB would need
  # per-player packet work.
  #
  # NO RADIUS KEY, deliberately. Range is DEFERRED by design decision -- it is
  # the vision/information question rather than a presentation setting, and
  # entity tracking range is the de facto limit until it is taken up. Do not
  # add one here without resolving that.
  objectiveGlow:
    enabled: false
    # Terrain-hugging glow slabs across the controlled ground. TRIED AND
    # REVERTED: the glow outline is drawn per entity, so every merged rectangle
    # carries its own silhouette and the volume fills with internal edges
    # instead of reading as one marked area. No tolerance fixes it -- nothing
    # lets a plugin merge outlines across entities. Kept for a map type where
    # no block accepts a biome colour, which is the one case the tint cannot
    # serve.
    groundSlabs: false
    colour:
      north: AQUA
      south: RED
  # The Aether Fountain restores its own team's Health and Hunger.
  #
  # Only a team's own Fountain restores that team, and a disabled Fountain
  # restores nothing, so recovery follows the respawn role rather than turning
  # the structure into a contestable heal pad. Radius and rates are NON-CANON
  # ALPHA FIXTURES; canon fixes the Fountain's relationship to respawning, not
  # how fast standing in one heals.
  fountainRegen:
    enabled: true
    intervalTicks: 20
    radius: 8.0
    healthPerInterval: 1.0
    foodPerInterval: 1
    # A player reappears reconstructing, not restored.
    respawnHealth: 1.0
    respawnFood: 1
  # Work Points: gameplay-driven progression. Only domains whose contribution
  # rule is specified enough to implement are wired; see
  # docs/analysis/alpha-0.1-progression.md.
  workPoints: { enabled: true, announce: true }
  # The plugin draws the Hunger readout because the vanilla row cannot
  # distinguish an empty drumstick from one beyond the player's Capacity.
  # Requires the resource pack, which blanks the vanilla row; without it the
  # glyphs are unmapped and the readout is unreadable.
  # Retired: the native hunger row is repainted as a bar by the pack, in its own
  # HUD position, so a parallel boss-bar readout is no longer what makes hunger
  # legible. Left switchable rather than deleted until the bar is judged in play.
  hungerDisplay: { enabled: false, refreshTicks: 10 }
  # Fixed-size health and hunger bars with a PROPORTIONAL internal fill, drawn
  # as glyphs on one bossbar title.
  #
  # The native rows cannot do this. The client owns their fill and its quantum
  # is the half-sprite, so twenty steps is the most they will ever show however
  # they are repainted -- bar_segments in the resource pack buys the LOOK of a
  # continuous bar and none of the resolution. VitalsScaling separately fixed
  # the LENGTH, by making the bar always twenty points and letting Capacity
  # decide what a point is worth. This fixes the fill: 65 levels, one per pixel
  # of a 64px bar.
  #
  # The bar is ONE UNIT GLYPH REPEATED, not one image per fill level. A bitmap
  # glyph cannot be stretched, so a bar that grows horizontally is a bar built
  # from repeated units and its length is the repeat count. It is always 64
  # units wide and only how many are LIT changes, which makes the fixed size
  # structural rather than something 130 separate images had to agree about.
  #
  # OFF, and hideNativeRows is off too, DELIBERATELY AND IN THAT ORDER. Without
  # the resource pack these codepoints render as tofu, and the last glyph
  # readout shipped with the vanilla row hidden and the replacement illegible --
  # reported, accurately, as "hunger is fully invisible". Turn this on, confirm
  # the bars draw, and only then hide the rows they duplicate.
  vitalsBar:
    enabled: true
    # Which width the bars draw at. The two are a real trade:
    #
    #   inline  81 units, exactly where vanilla's own row sits. Fits, and
    #           tickUnits then refuses marks above 2,700 displayed health --
    #           Mole's Lv30 3,200 loses them, the character they exist for.
    #   wide   128 units, the resolution the ticks were sized for, centred on
    #           the same two places and overhanging the hotbar by ~23px a side.
    #
    # Switch live and compare; this is what the two were built for.
    layout: inline
    # Vertical position, as the glyph ascent. The pack emits a unit set at
    # each of 20/30/40/50/60/73, so this is a live dial rather than a pack
    # rebuild -- ascent belongs to a font provider, and the placement law is
    # accurate enough to say roughly where a bar goes and not to land one.
    #
    # Higher is higher on screen. MEASURED by sweeping /moba hudprobe bars:
    # 73 sat well above the hotbar, 30 fell inside it, 50 is the slot the
    # native health and hunger rows occupied. Found by sweeping rather than by
    # fitting the placement law, which four rounds of screenshot measurement
    # never got accurate enough to land a bar with.
    ascent: 50
    # The numeral sits a few pixels ABOVE its bar rather than on the same
    # line. Swept with /moba hudprobe numeral; the pack carries a denser set
    # of heights here than the bars have, because "a few" had to be measured
    # like everything else on this HUD.
    numeralAscent: 56
    # The refusal line -- not unlocked, still on cooldown, cannot be used --
    # all three in one place, because they are the same category of answer and
    # a player scanning for a reason should not have to know which of three
    # places to look. Swept with /moba hudprobe notice.
    # The clock's label -- "In combat", or the unspent-points prompt. Its
    # countdown is the bossbar's own bar; this is just the words.
    # Higher is higher on screen; the ceiling is the 256-row canvas, past
    # which a provider's ascent is rejected outright. Swept with
    # /moba hudprobe clock.
    clockAscent: 256
    noticeAscent: 73
    # The charge meter shares the subtext line with the refusal text, and is
    # drawn from the SAME unit glyphs as the health and hunger bars at a
    # second height. A bossbar could not sit here: its graphic is fixed to the
    # bossbar strip and only its title moves.
    meterAscent: 73
    meterWidth: 48
    noticeTicks: 40
    refreshTicks: 4
    # Hides the native health and hunger rows via the resource pack. Requires a
    # pack rebuild and republish; it is not a live toggle. Do not set this
    # before confirming the bars above actually render.
    hideNativeRows: true
    # Reference ticks, in DISPLAYED health. A proportional bar shows a fraction
    # and a fraction alone erases magnitude -- 1,000/1,000 and 3,200/3,200 are
    # the same full bar -- which gives back exactly what the x100 scale was
    # adopted to buy. Ticks restore it: a bigger character carries visibly more
    # of them, and one tick is a yardstick, so a hit that eats two took 200.
    #
    # The bar stays fixed width and the ticks compress as max health grows.
    # Growing the bar instead would hand a low-Capacity player a shorter one,
    # which is the defect VitalsScaling exists to remove.
    #
    # At 100, Mole's Lv30 3,200 is 32 ticks across 128 units: one every 4px.
    # Below MIN_TICK_SPACING the bar draws no ticks at all rather than a solid
    # band of marks pretending to be a scale.
    tickInterval: 0
    # DisplayedHealth = EngineHealth x displayScale. Presentation only; all
    # simulation, config and balance stay in engine units. See
    # docs/design/CLASS_PROGRESSION_GROWTH_AND_TASK.md section 4.
    displayScale: 100
    # The exact total, beside the bar. Ticks give magnitude and a yardstick;
    # NOTHING reads an exact number off a bar, and this is the readout x100 was
    # decided for.
    showNumerals: true
    # Applied by the plugin, because the pack draws these glyphs WHITE and
    # assigns identity rather than palette. This is the palette decision, put
    # where it can be argued with.
    colours:
      # The numeral is drawn OVER the health bar, so it needs to read against
      # the fill rather than match it. White on red is the legible pair; the
      # health colour on the health bar would vanish.
      numeral: "#FFFFFF"
      # Refusals read as refusals, not as part of the readout.
      notice: "#FFAA55"
      # The clock label reads with its bar, not against it.
      clock: "#FFFFFF"
      health: "#FF5555"
      hunger: "#C88A3C"
      # The unlit run and the end caps. Every unit is drawn white by the pack,
      # so an unfilled unit only reads as unfilled once it is dimmed here.
      empty: "#4A4A4A"
  # Health regeneration relative to maximum Hunger. Vanilla requires food >= 18
  # to regenerate, and Capacity caps food at effectiveHunger, which starts at 9,
  # so vanilla regeneration can never fire on the canonical curve.
  #
  # Two empty drumsticks block regeneration. A drumstick is two food points, so
  # regeneration stops once 4 or more points are missing: at a maximum of 20
  # that blocks at 16, eight drumsticks or fewer, and permits from 17 up.
  #
  # Named for the BLOCKING condition on purpose. "Four below maximum" and
  # "eight or fewer drumsticks" differ by one point depending on which side the
  # comparison sits, and that is easy to encode backwards.
  #
  # The 6-food sprint cutoff is vanilla and is deliberately NOT reimplemented.
  hungerRegen:
    enabled: true
    blockedWhenPointsMissing: 4
    intervalTicks: 80
    healAmount: 1.0
    exhaustionPerHeal: 6.0
  lockedSlots:
    enabled: true
    # Must be unobtainable in survival: a material a player can hold would let
    # vanilla merge a pickup into the marker stack. BARRIER also reads as
    # blocked with no resource pack, and a pack can give it a subtle
    # slot-shaped texture instead.
    material: BARRIER
    label: "Locked slot"
    refreshTicks: 20
  contributions:
    enabled: true
  durability:
    enabled: true
  hubLobby:
    enabled: true
    originX: 0
    originY: 65
    originZ: 0
    spacing: 8
    floorMaterial: POLISHED_DEEPSLATE
    frameMaterial: POLISHED_BLACKSTONE_BRICKS
    cooldownMillis: 3000
    # Ships EMPTY. Which maps are offered is a selection decision, not a
    # plugin default. Each entry needs a label and the command to run.
    # Example, using the terrain gallery's own navigation:
    #   candidate_a:
    #     label: "930012642"
    #     command: "function harvest:visit/tv_ef56852eda10acc88342e5ee"
    destinations: {}
  rewardAdvancements:
    enabled: true
  infraMode:
    enabled: true
  routes:
    enabled: true
    minLength: 16.0            # endpoints closer than this are refused
    sampleEveryBlocks: 4.0
    maxSamples: 512
    keepEverySample: 2         # coarse retention; canon leaves geometry OPEN
    maxDesignationTicks: 24000
    corridorRadius: 6.0
    effectTicks: 20
    exhaustionRelief: 0.1      # sprint efficiency, never added speed
  # Mark the renewable resources THEMSELVES, not the region they sit in.
  #
  # This replaces a ring of particles drawn at the source's radius: a 40-block
  # circle at one fixed height, which answered "a source is somewhere around
  # here". Animals move, so a fixed ring stops describing a herd the moment it
  # wanders, and what a player has to recognise is the sheep rather than the pen.
  #
  # Animals and swarms GLOW -- a silhouette that tracks the entity, which no
  # particle emitter can do. Crops get a particle per qualifying block, because
  # blocks cannot glow. A depleted source marks nothing, so a mark means
  # "available" and not merely "exists".
  #
  # Glow renders through terrain, but NOT across the map: a client is never sent
  # an entity outside its tracking range, so the real exposure is spigot.yml's
  # entity-tracking-range.animals, 96 blocks here. It is not public information.
  #
  # Marking is therefore tuned for LEGIBILITY rather than concealment. Two
  # opposing players meeting at the same herd already implies one of them is in
  # contested or enemy ground, and at that range hiding the herd solves nothing
  # while costing every player the clarity the mark exists for.
  #
  # viewRadius is measured from the source centre and the source's own radius is
  # added to it, so 32 lights a 20-radius pen when a player is about 32 blocks
  # from its edge: close enough to be working it. It must stay well inside the
  # tracking range above, or the gate stops gating anything.
  # A player who is not a living participant of a RUNNING match takes no damage,
  # loses no hunger and is not targeted. Waiting to join is not gameplay, and
  # dying to a creeper on the way to the lobby is an interruption of the one
  # thing the player is trying to do.
  # Health and hunger as fixed-length bars.
  #
  # The bar is always twenty points -- ten hearts, ten drumsticks -- for every
  # player, and Capacity decides what a point is WORTH rather than how many
  # there are. A hit of 3 against Capacity 9 removes a third of the player
  # either way; what changes is that the bar stops shrinking, so a level-one
  # player no longer looks at a half-length health bar.
  #
  # For hunger this also dissolves the unreachable-drumstick problem outright:
  # Capacity becomes an exhaustion RATE, the row fills completely, and a smaller
  # Capacity simply empties it faster.
  #
  # naturalRegeneration is held OFF on purpose. Vanilla regen needs food >= 18,
  # which a Hunger Capacity of 9 made unreachable, so it has never fired and
  # HungerRegen was written to be the rule instead. Uncapping hunger would
  # switch vanilla's on as a side effect of a display change; that is a design
  # decision and is not taken here.
  vitalsScaling:
    enabled: true
    sampleTicks: 2
    naturalRegeneration: false
  lobbySafety:
    enabled: true
  # A dedicated lobby world, built rather than generated.
  #
  # The lobby used to be the server's default world: a vanilla superflat with a
  # vanilla village in it, which nobody authored and nobody chose. It also meant
  # the lobby shared a world with the terrain gallery, so "make the lobby safe"
  # could only be a listener cancelling damage -- setting that world peaceful
  # would have decided mob spawning and sleeping for the gallery too.
  #
  # Its own world makes the safety structural instead: nothing spawns, the
  # weather never changes, the sun never sets, and the room has no exit.
  #
  # Materials are a GREYBOX. Extent, enclosure and lighting are function and are
  # decided in code; what the room looks like is a design decision and is not.
  lobbyWorld:
    enabled: true
    name: moba_lobby
    radius: 16              # interior half-span, so the hall is 33 across
    floorY: 64
    height: 8               # interior headroom
    lightSpacing: 6
    sendOnJoin: true
    adventureMode: true
    floorMaterial: SMOOTH_STONE
    wallMaterial: STONE_BRICKS
    ceilingMaterial: STONE_BRICKS
    lightMaterial: SEA_LANTERN
    platformMaterial: POLISHED_ANDESITE
  draftHall:
    enabled: true
    originX: 40
    originZ: 0
    floorY: 64
    height: 8
    rankOffset: 6
    pitDepth: 2
    spacing: 2
    floorMaterial: POLISHED_DEEPSLATE
    wallMaterial: DEEPSLATE_BRICKS
    ceilingMaterial: DEEPSLATE_BRICKS
    lightMaterial: SEA_LANTERN
    platformMaterial: POLISHED_ANDESITE
    pitMaterial: DEEPSLATE_TILES
  renewableMarkers:
    enabled: true
    ticks: 20
    # Nothing is marked unless a player is within this range of the source.
    viewRadius: 32.0
    # Crop membership costs an O(radius^3) volume scan, so it is cached and
    # refreshed on this cadence rather than every tick.
    rescanTicks: 200
  renewableAuthoring:
    enabled: true
    reach: 48
    defaultRadius: 3
    defaultCapacity: 5
    recoverTicks: 200
  hud:
    enabled: true
    refreshTicks: 20
  taskProgression:
    enabled: true
  sentinelSkull:
    # Superseded by the tome while features.tome.enabled is true. Kept as the
    # fallback representation: a separate skull carrying the sentinel identity,
    # with no map surface.
    enabled: true
    material: SKELETON_SKULL
  # The server hands every arriving player the pack.
  #
  # It has to: the plugin blanks vanilla sprites and draws replacements from
  # private-use codepoints, so a client without the pack sees missing hunger
  # icons and tofu rather than a degraded version of the intended HUD. Before
  # this, build_pack.py wrote to wherever --output pointed and nothing ever put
  # the result in front of a client at all.
  #
  # sha1 is written by implementation/resourcepack/publish.py, which builds the
  # zip and the hash together. Clients cache by hash, so a rebuilt pack with a
  # stale hash is silently not applied -- a failure that looks exactly like the
  # pack not working.
  resourcePack:
    enabled: true
    url: "http://127.0.0.1:25580/moba-pack.zip"
    sha1: ""
    required: false
    prompt: "Minecraft MOBA uses a resource pack for its HUD."
  # PROBE, not a feature. Overrides the tome's GUI model with a scaled, offset
  # placeholder that should overflow the offhand slot to the LEFT, into the
  # empty HUD space beside it.
  #
  # It answers two questions: whether art can be placed at that exact position
  # at all -- glyphs can only sit on the action bar line above the hotbar -- and
  # whether overriding the item's model SUPPRESSES THE CORNER MINIMAP, which
  # renders because a FILLED_MAP is in the offhand. If the minimap dies, the
  # tome cannot carry an ability row and the row goes to glyphs instead.
  #
  # Off by default: it visibly changes the tome and is meant to be looked at
  # once and then decided, not left running.
  abilityPanelProbe:
    enabled: false
    itemModel: "moba:ability_panel"
  # The tome: ONE offhand item that is the sentinel, the class text and the map.
  #
  # SPEC section 11 requires the offhand item to be a FILLED_MAP from the start,
  # which is exactly what makes this possible: identity lives in persistent
  # data, the class blurb lives in name and lore, and the map view is the
  # minimap surface. The skull's appearance is the only thing given up, and a
  # resource pack can restyle the map item's icon.
  tome:
    enabled: true
  # The minimap drawn on the tome's surface. Every pixel is computed by
  # Minimap; vanilla tracking is off so no map terrain draws underneath.
  # Disabled, this falls back to the stub renderer rather than to vanilla.
  minimap:
    enabled: true
    blocksPerPixel: 4        # 128px surface, so 4 gives ~512 blocks of coverage
    terrainRefreshTicks: 40  # sampling 16k columns per frame is not affordable
    playerRange: 256.0
  # Recall, begun by lifting the tome out of the offhand slot in the inventory.
  # The gesture is deliberate and already dangerous in a fight, so unlike a
  # keybind it cannot fire by accident; the tome is never actually removed.
  #
  # channelTicks is a NON-CANON ALPHA FIXTURE.
  #
  # moveTolerance is REMOVED by design decision: "hold still" means hold still,
  # and the channel now cancels when the player's BLOCK POSITION changes. Do not
  # reintroduce it as 0.0 against a distance -- a standing player's location
  # drifts by floating-point amounts and every recall would cancel instantly.
  #
  # Recall is also gated on combat state now (see the top-level `combat` block).
  # channelTicks is a channel length and must NOT be borrowed as a combat window.
  recall:
    enabled: true
    channelTicks: 100        # 5s
    # Destination resolves to the player's own Aether Fountain during a match
    # (ALPHA-D3/D4 make the homeland the Fountain). Set destination.x/y/z to
    # override; fallbackToWorldSpawn applies only outside a match.
    fallbackToWorldSpawn: true
  # Defined at their CURRENT LIVE VALUES so the file stops disagreeing with the
  # code. These read as disabled today because the keys were absent and the
  # Java fallback is false -- writing them down changes nothing and is not an
  # endorsement of the value. Flip deliberately, not by discovering them.
  healthDisplay:
    enabled: false
    refreshTicks: 10
  pings:
    enabled: false
    cooldownMillis: 1500
    audienceRadius: 96.0
    markerSeconds: 8
  testbed:
    enabled: false
    constructsArePlayerPlaced: false

durability:
  targetBaseUses: {}

classes:
  test:
    # Eligibility is AUTHORED PER CLASS and may be asymmetric: several options,
    # one, or none. It is not inherited from archetype tags. The full class x
    # infrastructure matrix is [OPEN]; the discussion examples are Mole with
    # Route/Construct and Kitfighter with Monster Combat only, and neither is
    # settled. The harness class gets a deliberately mixed set for testing.
    infrastructureEligibility:
      - ROUTE
      - CONSTRUCT
      - MONSTER_COMBAT
    displayName: "Test Class"
    tomeName: "Tome of the Test Class"
    blurb:
      - "Harness class. Not a design."
      - "F = A1   Sneak+F = A2   Sprint+F = channel ult"
      - "Drop = ultimate. Swap again to stop casting."

# Prototype parameters, not final balance. Paper 1.21.11 / Java 21.
progression:
  maxLevel: 30
  # Retained as the fallback when a level falls outside every band.
  xpPerLevel: 100
  # WP required to leave each level.
  #
  #     cost(b, i) = 300 * bandMultiplier[b] * 1.15^i
  #
  # where b is the economic band and i counts advancements WITHIN that band
  # from 0. The band multipliers are the established relative requirement
  # indices and are unchanged:
  #
  #     Bootstrap 1.000  Established 1.350  Developed 1.875
  #     Advanced  2.575  Endgame     3.250
  #
  # The 300 baseline and the 1.15 in-band factor are WORKING ALPHA
  # CALIBRATION, not canon. Values are rounded to convenient 5-WP steps.
  #
  # The requirement DROPS at each band boundary, which is intentional and not a
  # rounding artefact: each economic phase restarts from its own multiplier and
  # then compounds within itself, so entering a new phase is a step down in
  # per-level cost and a step up in the cost the phase will reach.
  levelCosts:
    # Bootstrap (x1.000)
    "1": 300
    "2": 345
    "3": 395
    "4": 455
    "5": 525
    "6": 605
    # Established (x1.350)
    "7": 405
    "8": 465
    "9": 535
    "10": 615
    "11": 710
    "12": 815
    # Developed (x1.875)
    "13": 560
    "14": 645
    "15": 745
    "16": 855
    "17": 985
    "18": 1130
    "19": 1300
    # Advanced (x2.575)
    "20": 770
    "21": 890
    "22": 1020
    "23": 1175
    "24": 1350
    # Endgame (x3.250)
    "25": 975
    "26": 1120
    "27": 1290
    "28": 1485
    "29": 1705
    # Lv30 is the cap; there is no cost to leave it.
  # The band each level belongs to, kept so the curve can be checked against
  # the formula that generated it rather than only against itself.
  bandMultipliers:
    bootstrap: 1.000
    established: 1.350
    developed: 1.875
    advanced: 2.575
    endgame: 3.250
  # WP per recognized action, all under progression.work.* so that every key
  # the plugin reads is the key this file defines.
  #
  # RESOLUTION. These were calibrated against a 40-WP level and are now scaled
  # for a 300-WP one. The point of the higher resolution is NOT a flat 10x: it
  # is that 1 WP can stay the minimum accounting unit for a genuinely small
  # action while materially significant work moves into the tens. So the scale
  # is applied to substantive work and deliberately not to the small end --
  # production utility stays at 1, and consumables sit below 10x because they
  # arrive in stacks.
  #
  # Every number below is a NON-CANON ALPHA FIXTURE.
  work:
    # -- Construction ---------------------------------------------------
    # 1 WP is the ATOMIC Work Point: the smallest legible unit of progression,
    # not an exceptional or provisional value. Placing a block is mundane
    # legitimate Minecraft activity and earns exactly one of those.
    #
    # Mundane work is not supposed to become worthless -- it is supposed to
    # become insufficient. That job belongs to the level-cost curve, where a
    # 1 WP placement is 1/300th of a Bootstrap level and 1/1705th of an Endgame
    # one. Setting the award to 0 would have made the same point by deleting the
    # activity from the economy instead of by pricing it, which is a different
    # and worse claim.
    #
    # What stops this being a farm is the anti-recycling rule, not the
    # magnitude: credit attaches to a block POSITION a player has not built at
    # before, so place -> break -> place pays once. See ConstructionWorkTest.
    constructionBlockPlacement: 20
    ordinaryPlacement: 1          # the atomic Work Point
    # -- Extraction: WP = A(O) + qH -------------------------------------
    #
    # Rescaled into the new resolution, NOT replaced by a flat per-ore award.
    # A(O) credits exploiting one physical opportunity and is paid once per ore
    # block broken; H is the qualifying harvest actually obtained, read from the
    # real drops; q converts it to points. Fortune therefore still raises H and
    # never A(O), and raising q with A keeps Yield worth the same fraction of a
    # break as before rather than quietly demoting it.
    #
    # The q=10 flat coefficient keeps the known asymmetry it had at q=1:
    # multi-drop ores (redstone 4-5, lapis 4-9, copper 2-5) accrue more harvest
    # WP than single-drop ores. That is a calibration question rather than a
    # model question, and per-ore q would be a new design decision, so it is
    # still flagged rather than tuned away.
    extraction:
      # q, the harvest coefficient. Per ore kind, because a single flat q made
      # the harvest term proportional to an ore's DROP COUNT, which is a
      # property of the block and not of the work. Breaking one copper ore is
      # the same physical act as breaking one coal ore, but copper drops 2-5
      # raw copper, so at a flat q=10 one copper block paid 45 WP against
      # coal's 20 -- and very nearly as much as a diamond block's 50.
      #
      # Live evidence (2026-09-21): 30 copper blocks produced 1,250 WP, 56% of
      # a 2,220 WP expedition, from 25% of the blocks broken.
      #
      # The rule is q ~= 10 / expected drops, so a block of any ore yields
      # roughly the same harvest WP for the same act. Fortune still raises H
      # and still pays; what changed is that yield is now measured against what
      # the ore normally gives rather than against a flat scale.
      harvestCoefficient: 10        # single-drop default
      harvest:
        copper: 3                   # 2-5 raw copper per block
        redstone: 2                 # 4-5
        lapis: 2                    # 4-9
      silkTouchHarvest: 0           # UNRESOLVED: whether deferral is harvest
      opportunity:
        default: 0
        coal: 10
        copper: 10
        iron: 20
        gold: 30
        redstone: 20
        lapis: 20
        diamond: 40
        emerald: 40
        ancient_debris: 60
    # -- Production: WP_P = A(P) + qQ ------------------------------------
    #
    # A(P) is the UNDERTAKING -- the value of performing a meaningful
    # transformation at all -- paid once per output type per match. perOutput is
    # the marginal value of each additional unit.
    #
    # Purely linear per-output value made bulk consumables behave like capital:
    # in live play 48 loaves of bread paid 288 WP against 160 for a full set of
    # copper armour, and 27 smelted ingots paid 540. That says producing bread
    # at scale is the same KIND of accomplishment as equipping a player and
    # merely more of it.
    #
    # The split is general rather than a bread exception, and discrete durables
    # come out ahead without being special-cased: a pickaxe is one undertaking
    # for one item, so A(P) dominates it, while a hundred loaves asymptote to
    # perOutput. It is also the shape the other domains already use --
    # Construction pays per new position, Exploration per first resolution -- so
    # "the first time is worth more than the repetition" is now one idea rather
    # than three.
    #
    # Categories are enumerated in ProductionRecipes; a recipe outside them is
    # UNRESOLVED and pays nothing rather than being guessed at. Storage-block
    # compression pays nothing in the crafting direction, which is what stops
    # ingot <-> block from being an unbounded loop.
    production:
      tool:               { undertaking: 30, perOutput: 1 }
      equipment:          { undertaking: 40, perOutput: 2 }
      utility:            { undertaking: 10, perOutput: 1 }
      consumable:         { undertaking: 20, perOutput: 1 }
      strategic_input:    { undertaking: 20, perOutput: 2 }
      construction_block: { undertaking: 20, perOutput: 2 }
    # -- Development: improved productive renewable state ----------------
    # Both events are gated by real time (a breeding cooldown, a growth cycle)
    # rather than by a cooldown imposed here.
    development:
      breeding: 80
      matureCropHarvest: 20
    # -- Exploration: novel Reach ----------------------------------------
    # Credited once per player per registered Worksite per match. Distance
    # walked, chunks entered and re-crossed geography pay nothing.
    exploration:
      siteResolved: 60
      radius: 24.0
      intervalTicks: 20
  task:
    tierMax: 3
    efficiencyPerTier: 0.30      # BLOCK_BREAK_SPEED multiplier per tier
    damagePerTier: 1.0           # flat ATTACK_DAMAGE per tier
    yieldExtraChancePerTier: 0.25
    # Efficiency covers Unbreaking as well as block-breaking speed.
    efficiencyGrantsUnbreaking: true
    # Canon cadence: L4 Efficiency I universal, L7 Yield I universal,
    # then a choice at L9, L14 and L19. Automatic grants:
    automatic:
      4: { domain: EFFICIENCY, tier: 1 }
      7: { domain: YIELD, tier: 1 }
  # The Level 6 fork: one class-compatible Infrastructure form, or Monster Combat.
  contributionForkLevel: 6

# Equipment wear. Follows the family-wide doctrine in manuscript 15.1.2:
#     L_e = D_e * U_e / R_e
# expected useful lifetime = base durability * Unbreaking multiplier /
# consumption rate under that category's workload. Identity belongs to the
# material FAMILY, so targets are per material and per equipment category
# rather than one number per material.
#
# Ladder: Wood temporary -> Stone disposable -> Copper replaceable legitimate
# equipment -> Iron reliable -> Diamond capital -> Netherite premier.
# Copper became a Primary Material on 19 September 2026.
#
# Ships EMPTY, which is vanilla. 15.1.1 is labelled a NON-CANON BALANCE-TEST
# CANDIDATE and exact values remain OPEN, so its numbers are commented below
# rather than defaulted. Uncomment to run the sensitivity test.
#
# Unbreaking needs no coefficient: vanilla's 1/(level+1) already reproduces the
# 15.1.1 column, with Iron 96 reaching ~192, ~288 and ~384 at Unbreaking I-III.
#
# durability:
#   targetBaseUses:
#     wood:   { tool: 16 }
#     stone:  { tool: 36 }
#     copper: { tool: 60 }
#     iron:   { tool: 96 }
capacity:
  enforceTicks: 1
  # The shared Growth clock. Every class receives a Growth packet at these
  # levels; what each packet contains is class-authored and differs per class.
  # Placed under `capacity` because that is where the existing seam is - Capacity
  # is one recipient of Growth, not its owner.
  growthLevels: [3, 6, 9, 12, 15, 18, 21, 24, 27, 30]
  # Fallback curve for a class with no authored profile. A bootstrap so an
  # unconfigured class still loads, NOT a roster-wide default: do not treat
  # these numbers as the shape other classes should take.
  health: { start: 9, growthUnit: 1, cap: 20 }
  hunger: { start: 9, growthUnit: 1, cap: 20 }
  # Targets the ~24 USEFUL-CAPACITY end-state, not the vanilla 36. 36 is the
  # engine maximum, not the amount a character needs to function: a fixed
  # loadout taxes the same handful of slots whatever the total is, so 6->18 is
  # enormously valuable, 18->24 is operational sufficiency, and 24->36 is
  # situational hauling capacity that should be SPECIALIZATION rather than
  # something every class marches through.
  #
  # The economic reason outweighs the class reason: if everyone reaches 36
  # early, inventory pressure disappears and Routes, Supply Lines, storage and
  # expedition planning lose part of their purpose.
  #
  # cap stays 36 so a capacity specialist can still exceed 24.
  #
  # Steps rather than a growthUnit because Inventory is DISCRETE and authored,
  # not a continuous curve: a flat hold across a Growth is the class spending
  # that budget elsewhere. Six +3 packets, at Lv3/9/15/18/24/30.
  #
  # [WORKING] The cadence is a placeholder. This is a bootstrap for an
  # unauthored class and wants authoring like any other.
  slots: { steps: [6, 9, 9, 12, 12, 15, 18, 18, 21, 21, 24], cap: 36 }
# Per-class stat curves, selected by ClassDefinition.statGrowthProfile.
# Engine units. The player-facing scale is x100 and belongs to the HUD: Mole's
# 10 -> 32 HP reads as 1,000 -> 3,200 Health. Simulation stays in native HP.
capacityProfiles:
  # Extremely low health growth, normal hunger, extreme inventory growth.
  # The squishiest class on the roster by design: the machine is the defence,
  # and a Toolbox that could also take hits would not have to build one.
  toolbox:
    # 80 -> 240 engine, +1.6 per Growth. Ends where most classes start
    # climbing; three netherite hits at maximum level.
    # 1,000 -> 2,400. 2,400 sits at the TOP EDGE of the three-netherite-hit
    # and two-crit bands and 2,500 flips both, so this is the most health
    # obtainable while still dying in three -- limited in hits taken
    # independently of the Utility Belt's cooldown. classes.md is canonical
    # for the number; an earlier build here had 8/1.6 from memory and
    # contradicted it.
    health: { start: 10, growthUnit: 1.4, cap: 24 }
    # Normal. Nothing about the class argues for a hunger identity.
    hunger: { start: 10, growthUnit: 2, cap: 20 }
    # Reaches 36 at Lv24, not 24 -- the only class that does, and the reason
    # is structural rather than generous. Inventory capacity is the
    # DIMENSIONS OF A PROGRAMMABLE BOARD for this class, so a curve that
    # stops at 24 stops the class, and the breakpoints are the ones the
    # circuit grammar cares about:
    #
    #   Lv3  12  hotbar plus three cells -- the program leaves the magazine
    #   Lv6  18  two full 9-wide rows, NOT vertically adjacent: no hooks
    #   Lv9  21  first vertical adjacency, three Tripwire columns
    #   Lv15 27  full-width Tripwire -- the requirement, not a convenience
    #   Lv18 36  THE SPIKE, +9: the fourth row lands whole, 27 positions
    #
    # 36 arrives at Lv18, not Lv24. Under the useful-capacity model the 24->36
    # band is situational hauling for every other class; for this one 27 is
    # the requirement for full-width Tripwire, so the specialist band is core
    # mechanical function and has to land before the match is decided.
    #
    # 18 being a horizontal milestone only is the point of the middle of
    # this curve, not a gap in it.
    slots: { steps: [6, 12, 18, 21, 24, 27, 36, 36, 36, 36, 36], cap: 36 }
  mole:
    # 100 -> 320 engine, +2.2 per Growth. Regular by design: Health is the
    # continuous curve and spikes come from abilities, branches, Task
    # thresholds and discrete capacity instead.
    health: { start: 10, growthUnit: 2.2, cap: 32 }
    # 10 -> 20 by Lv15, then flat. The cap produces the plateau on its own;
    # there is no Lv15 special case.
    hunger: { start: 10, growthUnit: 2, cap: 20 }
    # Irregular by design: absolute values at Lv0 then one per Growth level.
    # Holding flat across a Growth is Mole spending that budget elsewhere.
    #
    # Six +3 packets, at Lv3/9/12/18/24/30, reaching the ~24 useful-capacity
    # end-state ONLY at maximum level -- deliberately stretched across the whole
    # match rather than solving inventory by Lv18 and spending the second half
    # with nothing left to gain.
    #
    # Lv6 is a Growth breakpoint where Mole receives Exhaustion Efficiency I
    # instead. That is why there is no formula here to extrapolate: Growth is a
    # SHARED CLOCK WITH CLASS-AUTHORED CONTENTS, so a class may take nothing in
    # a given capacity at a given breakpoint. See
    # docs/design/CLASS_PROGRESSION_GROWTH_AND_TASK.md.
    slots: { steps: [6, 9, 9, 12, 15, 15, 18, 18, 21, 21, 24], cap: 36 }
    # SEAM, NOT YET READ BY ANY CODE. Exhaustion Efficiency is one quantitative
    # attribute rather than four perks, and Mole improves it at these Growth
    # levels. The cadence is decided; the magnitudes are not, and the previously
    # circulated 6/12/18/24 percentages were illustrative prototypes rather than
    # calibration. `values` stays empty until a magnitude is measured.
    exhaustionEfficiency:
      levels: [6, 12, 21, 27]
      values: []
rewards:
  # Task allocations. Seven opportunities across three trees, so Y + E + S = 7
  # at completion. 4 + 4 > 7 makes Tier IV a commitment threshold on its own:
  # no exclusivity rule is needed or encoded.
  #
  # These options carry `task` and no `capacity`. Capacity specialization is
  # superseded by Growth, and an option is not required to declare a capacity
  # effect it does not have.
  levels:
    4:
      - { id: task_yield_4, label: "Yield", icon: GOLD_INGOT, task: yield }
      - { id: task_efficiency_4, label: "Efficiency", icon: IRON_PICKAXE, task: efficiency }
      - { id: task_slaying_4, label: "Slaying", icon: IRON_SWORD, task: slaying }
    8:
      - { id: task_yield_8, label: "Yield", icon: GOLD_INGOT, task: yield }
      - { id: task_efficiency_8, label: "Efficiency", icon: IRON_PICKAXE, task: efficiency }
      - { id: task_slaying_8, label: "Slaying", icon: IRON_SWORD, task: slaying }
    12:
      - { id: task_yield_12, label: "Yield", icon: GOLD_INGOT, task: yield }
      - { id: task_efficiency_12, label: "Efficiency", icon: IRON_PICKAXE, task: efficiency }
      - { id: task_slaying_12, label: "Slaying", icon: IRON_SWORD, task: slaying }
    16:
      - { id: task_yield_16, label: "Yield", icon: GOLD_INGOT, task: yield }
      - { id: task_efficiency_16, label: "Efficiency", icon: IRON_PICKAXE, task: efficiency }
      - { id: task_slaying_16, label: "Slaying", icon: IRON_SWORD, task: slaying }
    20:
      - { id: task_yield_20, label: "Yield", icon: GOLD_INGOT, task: yield }
      - { id: task_efficiency_20, label: "Efficiency", icon: IRON_PICKAXE, task: efficiency }
      - { id: task_slaying_20, label: "Slaying", icon: IRON_SWORD, task: slaying }
    24:
      - { id: task_yield_24, label: "Yield", icon: GOLD_INGOT, task: yield }
      - { id: task_efficiency_24, label: "Efficiency", icon: IRON_PICKAXE, task: efficiency }
      - { id: task_slaying_24, label: "Slaying", icon: IRON_SWORD, task: slaying }
    28:
      - { id: task_yield_28, label: "Yield", icon: GOLD_INGOT, task: yield }
      - { id: task_efficiency_28, label: "Efficiency", icon: IRON_PICKAXE, task: efficiency }
      - { id: task_slaying_28, label: "Slaying", icon: IRON_SWORD, task: slaying }
  toast: { fadeInTicks: 5, stayTicks: 30, fadeOutTicks: 10 }
abilities:
  # Aiming, for the Hold and Double cast modes.
  #
  # Bukkit has NO BUTTON-UP. There is no release event, and org.bukkit.Input
  # carries movement keys only, not clicks. What can be read is that a held
  # button keeps arriving -- the client repeats its packets while aimed at a
  # block -- so release is the input going quiet for longer than that gap.
  #
  # Hold is therefore a heuristic and Double is exact. A Hold cast that fires
  # early was a dropped packet, and no tuning makes it a promise; graceTicks
  # is the whole surface.
  aim:
    # PER INPUT, because the client repeats them at different rates. Right
    # click is throttled to roughly four ticks, so its window must clear that
    # or a genuine hold fires between packets; left click repeats far faster
    # while held and can be much shorter.
    #
    # Shorter is better, because this window is ALSO the floor on how fast a
    # TAP fires. A player hovering an Ultimate over a bridge also meets the
    # enemy already standing on it, and should not pay a third of a second to
    # get the same cast out -- a tap under Hold should behave as Quick does.
    #
    # [FIXTURE -- expect to tune] Inferred from vanilla's use cadence, not
    # measured. Set logInputGaps and hold each button to read the real gaps.
    grace:
      left_click: 2
      right_click: 5
    logInputGaps: false
    # An aim nobody resolves must not persist forever. Hold fires at the
    # ceiling (the button was evidently down); Double cancels (no second
    # press ever came).
    maxTicks: 200
  bindings:
    mode: SWAP_HAND
    a1: LEFT_CLICK
    a2: RIGHT_CLICK
    ult: DROP
  modeTimeoutTicks: 50
  # Level at which each slot becomes usable, from the classes.md working
  # breakpoint table: Ability 1 at 1, Ability 2 at 2, Ultimate at 15. The
  # Ultimate's timing is recorded there as unresolved, so 15 is that table's
  # working value rather than a decision taken in code.
  unlockLevels: { a1: 1, a2: 2, ult: 15 }
  logExecutions: true
  # User-authorized prototype test kit. Not class design or balance canon.
  classes:
    # Toolbox. Construction archetype: the inventory IS the program.
    #
    # PARTIAL KIT, deliberately. Only the Utility Belt passive is built;
    # A1 (Reconfiguratron!), A2 and the Ultimate are designed in
    # docs/design/TOOLBOX_CIRCUIT_GRAMMAR.md and not yet implemented, so
    # their slots are absent rather than pointed at a placeholder. An
    # unbound input does nothing, which is honest; a placeholder would be a
    # lie that looked like a feature.
    toolbox:
      displayName: "Toolbox"
      passiveHook: "utility_belt"
      # Extremely low health growth, normal hunger, extreme inventory
      # growth -- reaching 36 slots by Lv24 rather than the usual 24.
      statGrowthProfile: "toolbox"
      # Growth clock. Mostly CONSTRUCTS, and otherwise Buildable Scale --
      # Toolbox builds machines and wants them bigger, not a logistics
      # network. Placement Reach is PERSONAL rather than infrastructure: it
      # changes which positions and geometries are possible, which is what
      # the lava rule made Toolbox's block interactions depend on.
      #
      # The Lv30 capstone is DEFERRED, not absent. Its slot is left empty
      # rather than filled with a placeholder.
      branches: { reconfiguratron: more_config, jumpstartinator: super_circuit }
      persistentStateDefaults:
        reconfiguratronBranch: more_config
        jumpstartinatorBranch: super_circuit
      a1: reconfiguratron
      a2: jumpstartinator
      ult: gizmo
      growth:
        level6:
          infrastructure:
            - { dimension: count, effect: constructs, tier: 1 }
        level9:
          personal:
            - { dimension: placement_reach, effect: reach, tier: 1 }
        level12:
          infrastructure:
            - { dimension: count, effect: constructs, tier: 2 }
        level15:
          infrastructure:
            - { dimension: buildable_scale, effect: buildable_scale, tier: 1 }
        level21:
          infrastructure:
            - { dimension: count, effect: constructs, tier: 3 }
          personal:
            - { dimension: placement_reach, effect: reach, tier: 2 }
        level24:
          infrastructure:
            - { dimension: count, effect: constructs, tier: 4 }
        level27:
          personal:
            - { dimension: placement_reach, effect: reach, tier: 3 }
    test: { a1: lunge, a2: sinkhole_lite, ult: channel_ult }
    lightfooted:
      displayName: Lightfooted
      # animal_senses is now DISPATCHED, by Passives. Before that this key was
      # parsed, stored, exposed on ClassDefinition and read by nothing, on every
      # class in the file.
      passiveHook: animal_senses
      statGrowthProfile: lightfooted
      infrastructureProgression: { level6: routes, level12: traversal_expression }
      branches: { lunge: swarming_bite }
      persistentStateDefaults: { lungeBranch: swarming_bite }
      a1: lunge
      # Was sinkhole_lite: the shared prototype stub, which is Mole's ability
      # and said nothing about this class.
      a2: bounding
      ult: channel_ult
    # The class that could not be configured at all under one effect per level.
    # Lv6 is Supply Line access AND Signal Flares I; Lv18 is Signal
    # Flares II plus crew combat development. Both are two effects, and
    # neither is two INFRASTRUCTURE effects -- which is why the packet has
    # families rather than a longer list of infrastructure strings.
    #
    # [WORKING] Effect names and tiers are placeholders standing in for design
    # that is still open: crew capacity progression, Supply Line establishment
    # rules, and Signal Flares / Reach / Throughput magnitudes are all
    # unresolved in CLASS_PROGRESSION_GROWTH_AND_TASK.md. This entry exists to
    # prove the data model holds the class, not to balance it.
    skeleton_crew:
      displayName: Skeleton Crew
      passiveHook: undead_affinity
      statGrowthProfile: fallback
      growth:
        level6:
          infrastructure:
            - { dimension: eligibility, effect: supply_line }
          methodology:
            - { effect: signal_flares, tier: 1 }
        level18:
          methodology:
            - { effect: signal_flares, tier: 2 }
          # REMOVED 27 September 2026: `crew_combat_development`. Growth does
          # not touch abilities, and developing the crew's combat is developing
          # an ability's output. The recovered spec had it here; it was a
          # mistake, and it is recorded rather than quietly replaced because it
          # is the first case the firewall had to adjudicate.
          #
          # Lv18's second effect is [OPEN] and waits on crew capacity
          # progression, which classes.md lists as unresolved -- "whether it is
          # Growth, kit, infrastructure consequence or mixed". If crew capacity
          # turns out to be Growth, it is a PERSONAL class-resource capacity and
          # belongs here; if it is kit, it does not.
      a1: lunge
      a2: sinkhole_lite
      ult: channel_ult
    mole:
      displayName: Mole
      passiveHook: sifth_sense
      statGrowthProfile: mole
      # Mole reaches Routes late because Routes are secondary to its
      # excavation/combat methodology. This is Mole's authored timing, NOT a
      # roster rule: Skeleton Crew takes Supply Line access at Lv6, and
      # Gardener is expected to take Development Zone capacity there too.
      # The blocker recorded here is CLEARED: see `growth:` below, and
      # skeleton_crew for the two-effect level that could not be expressed.
      # infrastructureProgression is SUPERSEDED and still read, translating to
      # a single INFRASTRUCTURE effect per level -- which is all it ever meant.
      infrastructureProgression:
        level18: routes_establish
        level21: routes_reach
        level24: routes_projection
        level27: routes_capacity_2
        level30: routes_reach_2
      branches: { tunneling: bore, drill_rush: armored_emergence }
      persistentStateDefaults: { tunnelingBranch: bore, drillRushBranch: armored_emergence }
      a1: tunneling
      # Was sinkhole_lite: the shared prototype stub, which Lightfooted also
      # carried until Bounding replaced it. Mole's A2 is Drill Rush.
      a2: drill_rush
      ult: channel_ult
    # Daredevil. The kit exists in classes.md section 17; this entry makes its
    # three abilities reachable. [OPEN] statGrowthProfile, passiveHook for
    # Skydiver, and infrastructureProgression are not yet authored, so the
    # class is playable but not progressed.
    daredevil:
      displayName: Daredevil
      branches: { runway: trampoline, crash_landing: combat_roll }
      persistentStateDefaults: { runwayBranch: trampoline, crashLandingBranch: combat_roll }
      a1: runway
      a2: crash_landing
      ult: deathly_clutches
  definitions:
    # Toolbox's passive. Incoming damage -- from anything, including mobs,
    # fall and fire -- runs the inventory circuit, because the belt is a
    # machine reacting to being hit rather than a combat state.
    utility_belt:
      displayName: "Utility Belt"
      # Unused: the belt is a passive and never reaches the ability clock
      # through an input. Present because Ability requires it, and zero so a
      # stray manual invocation would not be silently throttled by a second,
      # invisible cooldown beside cooldownByLevel.
      cooldownTicks: 0
      combat: false
      # ABILITY clock, [WORKING]: 16 / 14 / 12 / 10 / 6 seconds.
      # The fourth step is at 20 rather than 15 because Lv15 already grants
      # the Ultimate, and budgets need not be equal at every event.
      cooldownByLevel:
        level0: 320
        level5: 280
        level10: 240
        level20: 200
        level25: 120
      # How far an Observer looks along Toolbox's live facing, FROM THE
      # CURRENT ORIGIN -- which is what permits relay.
      observeRange: 24.0
      pistonPower: 1.2
      pistonRadius: 3.0
      # What Illuminated is worth: a marginal knockback source made
      # sufficient to put someone into a small receiving hole.
      illuminatedKnockback: 2.5
      hopperRadius: 6.0
      # [OPEN] Dust's mitigation. Resistance is a stand-in for a number the
      # design has not chosen.
      dischargeTicks: 40
    lunge:
      displayName: Lunge
      cooldownTicks: 10
      # Combat: it closes distance onto a combatant and hits them. Every branch
      # lands combat, but declare each anyway -- per-branch is how a later edit
      # to one branch is stopped from inheriting a stale answer.
      combat: true
      power: 0.8
      animalRadius: 12
      # The sweep. [WORKING] carried over from the source branch as provisional
      # calibration; hitDistance is gone with the single cast-time ray trace it
      # parameterized.
      damage: 2.0
      damageRadius: 1.6
      sweepTicks: 8
      branches:
        # Damage scaled by the pack around you.
        swarmingBite: { perWolfPower: 0.03, combat: true }
        # Disables the target's mainhand: acting on capacity to fight.
        thievingSwipe: { power: 1.0, disableTicks: 30, combat: true }
        # A committed leap onto a target, paid for with a rooted windup.
        stalkingPounce: { power: 1.6, windupTicks: 12, combat: true }
    bounding:
      displayName: Bounding
      # Non-combat: it is travel. It does nothing to anybody's capacity to
      # fight, and attacking is refused for its duration precisely so it cannot
      # become a gap-closer with a swing on the end.
      combat: false
      cooldownTicks: 60
      # [WORKING] Carried over from codex/lightfooted-from-phase1, where these
      # were labelled provisional calibration. None has been played.
      bounds: 3
      boundSpeed: 0.9
      boundLift: 0.42
      boundTicks: 8
      animalRadius: 10.0
      # Branches. All three are takeoff-terrain modifiers and none deals
      # damage, so all three inherit Bounding's non-combat declaration.
      # Terrain families are matched by material NAME, so a new wood's leaves
      # or a new snow variant joins its family without a config edit.
      branches:
        drift_to_drift: { combat: false }
        branch_to_branch: { speedMultiplier: 1.35, extraLift: 0.35, combat: false }
        track_to_track: { combat: false }
    # Toolbox A1. [WORKING] values are provisional calibration.
    reconfiguratron:
      displayName: "Reconfiguratron!"
      # Non-combat: it rearranges Toolbox's own inventory and does nothing to
      # anybody's capacity to fight. Spare Parts heals, which is still not
      # combat -- the Utility Belt it edits is separately declared.
      combat: false
      cooldownTicks: 120            # 6s
      # How many components from each end are exchanged.
      depth: 2
      spareParts:
        # Effective Health points per component the swap left alone, scaled
        # per player like every other configured health quantity.
        healthPerComponent: 1.0
      branches:
        speedy_swap: { cooldownMultiplier: 0.5, combat: false }
        more_config: { depth: 3, combat: false }
        spare_parts: { combat: false }
    # Toolbox's Ultimate. [WORKING] values are provisional calibration.
    gizmo:
      displayName: "Gizmo of Absurdity and Untold Destruction!!!"
      combat: true
      cooldownTicks: 1340           # 67s
      # The two caps are PAIRED: 120 / 32 is 3.75 ticks each, so a fast clock
      # is bounded by activations and a broad slow machine by time. Both bite,
      # in different builds.
      #
      # Six seconds is also the Lv25 passive cooldown, and A2 holds three
      # charges, so the window is a burst window for the whole kit.
      durationTicks: 120            # 6s
      activations: 32
      # [OPEN] Ownership. The design says "the next Redstone circuit Toolbox
      # POWERS", which cannot be evaluated without tracing redstone graphs. A
      # radius is the stand-in: physical, legible, and bounded. It is not the
      # authored rule and should not be mistaken for it.
      machineRadius: 32.0
    # Toolbox A2. [WORKING] values are provisional calibration.
    jumpstartinator:
      displayName: "Jumpstartinator!"
      # Combat: it fires the belt's components at targets on demand. The
      # passive declares separately; this is the manual activation of it.
      combat: true
      # Unused -- A2 is charge-limited. Zero so nothing reads a cooldown that
      # does not exist.
      cooldownTicks: 0
      charges: 3
      rechargeTicks: 160            # 8s
      components: 2
      # Short Circuit fires when FEWER than this many components resolved.
      shortCircuitBelow: 2
      shortCircuit:
        damage: 6.0
        radius: 4.0
      branches:
        overcharging: { combat: true }
        super_circuit: { components: 3, combat: true }
        short_circuit: { combat: true }
    # Daredevil. [WORKING] every value is provisional calibration carried
    # from codex/lightfooted-from-phase1; none has been played.
    runway:
      displayName: Runway
      # Non-combat at base: it is traversal, and converts Daredevil's own
      # momentum into height. Suplex is combat because it takes an enemy with
      # it, which is the branch declaring what the base does not do.
      combat: false
      cooldownTicks: 60
      # Measured horizontal travel per tick, not getVelocity(): the server's
      # velocity for ordinary ground movement is near zero because the client
      # moves itself.
      momentumThreshold: 0.25
      upward: 0.8
      suplexReach: 2.0
      branches:
        pop_rocket: { horizontalMultiplier: 1.8, upwardMultiplier: 1.8, combat: false }
        trampoline: { horizontalMultiplier: 1.25, upwardMultiplier: 1.25, combat: false }
        suplex: { combat: true }
    crash_landing:
      displayName: "Crash Landing"
      combat: true
      cooldownTicks: 80
      # Downward speed required to Crash at all.
      crashVelocity: 0.8
      # Fixed, in effective Health points: the cost is knowable before the
      # commitment, while the payoff is not.
      selfDamage: 2.0
      impactDamageScale: 3.0
      impactRadius: 4.0
      # Crater: Stun ticks per unit of descent spent, so a bigger Crash is a
      # longer Stun as well as a smaller hit.
      craterStunTicksPerVelocity: 12.0
      branches:
        crater: { selfDamageMultiplier: 2.0, impactDamageMultiplier: 0.6, combat: true }
        combat_roll: { selfDamageMultiplier: 0.5, impactDamageMultiplier: 0.25, combat: true }
        superhero: { selfDamageMultiplier: 0.0, impactDamageMultiplier: 1.0, combat: true }
    deathly_clutches:
      displayName: "Deathly Clutches"
      combat: true
      cooldownTicks: 1200
      # Effective Health points, scaled per player like every other configured
      # health quantity.
      nearDeathHealth: 1.0
      instances: 3
      restores: 2
    # Mole A2.
    drill_rush:
      displayName: "Drill Rush"
      combat: true
      cooldownTicks: 200
      emergeDistance: 2.0
      emergeRadius: 2.5
      emergeDamage: 4.0
      # Undermine stuns only coming up from below. The facing's Y component
      # above this counts as a floor emergence rather than a wall one.
      undermineUpwardFacing: 0.5
      undermineStunTicks: 30
      branches:
        armored_emergence: { combat: true }
        undermine: { combat: true }
        burrow_chain: { combat: true }
    sinkhole_lite:
      displayName: SinkholeLite
      # Combat, following Sinkhole's settled classification: it is crowd
      # control that slows enemies and denies them building, and the terrain is
      # only its medium. NOTE this stub is input plumbing, not class design or
      # balance canon -- but it must still declare, or it declares by accident.
      combat: true
      cooldownTicks: 10
      radius: 3
      maxSelectionBlocks: 4096
      rayDistance: 12
      blocksPerStage: 12
      stageTicks: 2
    channel_ult:
      displayName: ChannelUlt
      # Non-combat: the test-kit channel resolves to nothing and so acts on
      # nobody's capacity to fight. This is a statement about the STUB, not a
      # classification of any real ultimate that replaces it.
      combat: false
      cooldownTicks: 10
      channelTicks: 30
      movementThreshold: 0.25
    tunneling:
      displayName: Tunneling
      # Non-combat, and named in the design as the case that proves the rule:
      # it moves the same blocks Sinkhole does, and does nothing to anybody's
      # capacity to fight. A blanket "abilities are combat" rule would lock
      # Mole out of progression while it performed its defining activity.
      combat: false
      cooldownTicks: 10
      targetDistance: 12
      maxDistance: 16
      clearAhead: 1.2
      speed: 0.08
      width: 1
      height: 2
      interruptDisplacementSquared: 0.36
      interruptOffPathSquared: 0.25
      branches:
        bore: { speedMultiplier: 1.6, combat: false }
        gallery: { width: 3, combat: false }
  feedback:
    enter: { sound: minecraft:block.note_block.pling, volume: 0.5, pitch: 1.2 }
    exit: { sound: minecraft:block.note_block.pling, volume: 0.5, pitch: 0.8 }

# Combat state: the shared definition of "in combat".
#
# Five systems assumed this and none defined it -- level-up selection, Recall,
# Health Mastery's Absorption, Shovel Pathfinding and Skeleton Crew's Deadline.
# ONE duration for all of them, deliberately: the player has to be able to see
# this, and five private windows could not honestly be shown as one state.
#
# A consumer wanting more quiet than this provides should add its own delay ON
# TOP of being out of combat. "Out of combat, then a further N" stays
# explicable in a way a private 12-second combat window never would.
#
# See docs/design/COMBAT_STATE.md. Per-ability classification lives with each
# ability, at abilities.definitions.<id>.combat and .branches.<branch>.combat.
# Class passives, dispatched by ClassDefinition.passiveHook.
#
# The hook was declared on every class and read by NOTHING until this existed.
# A passive is named in config and resolved in Passives.java.
#
# Passives never set combat state. An always-on effect that marked combat would
# leave its class permanently in it -- unable to level up, Recall, or hold any
# out-of-combat effect. See docs/design/COMBAT_STATE.md.
passives:
  enabled: true
  # How often standing passive attributes are rewritten. Event-shaped passives
  # (damage, fall) do not use this; they are read at the event.
  tickTicks: 10
  # Lightfooted. Wolves mitigate damage, cats soften falls, foxes add speed --
  # three species with three unrelated benefits, deliberately not one stacking
  # animal bonus, because choosing which animals to travel with should be a
  # decision with a position and a logistics cost attached.
  animalSenses:
    radius: 10.0
    # [WORKING] Carried over from codex/lightfooted-from-phase1 as provisional
    # calibration. Unplayed.
    wolfDamageReduction: 0.02
    catFallReduction: 0.10
    foxSpeedBonus: 0.03
    # The CAP IS LOAD-BEARING, not tuning. The source branch clamped only at
    # zero, so enough wolves reached literal damage immunity. Animals are free,
    # renewable and breedable, and the map compiler deliberately stocks them,
    # so an uncapped count is an invitation rather than an edge case. Four
    # matches the ceiling Swarming Bite already uses.
    speciesCap: 4
  # Mole. Breaking sand or gravel sifts the connected mass instead of letting
  # it collapse. classes.md leaves sense radius and sift volume unresolved, so
  # both are [FIXTURE -- expect to tune] rather than balance decisions.
  #
  # The VOLUME is the load-bearing one. A dune is effectively unbounded
  # connected sand, so without a cap this is a flood fill across a desert on a
  # single block break -- a server stall rather than a strong passive. The
  # radius alone does not bound it usefully: an 11-cube holds 1331 blocks.
  sifthSense:
    radius: 5
    volume: 64
  # Skeleton Crew. Hostile undead pursue from substantially farther than normal,
  # converting night-time danger into economic opportunity.
  #
  # ONLY THE PURSUIT HALF IS BUILT. The passive also generates Crew on kills,
  # and Crew -- worker entities with cargo, Supply Line deposits and a priority
  # order -- does not exist. A counter nothing spends would be a placeholder one
  # layer in, so it is absent rather than stubbed.
  #
  # [FIXTURE -- expect to tune] "Substantially farther" is the only constraint
  # classes.md gives; doubling is the reading taken. vanillaRange is the band's
  # LOWER bound, not a cap: inside it vanilla already pursues, and re-targeting
  # there would make the passive's own contribution unmeasurable.
  undeadAffinity:
    range: 32.0
    vanillaRange: 16.0

combat:
  # [PROTOTYPE] 7 seconds is a first value, not calibration.
  #
  # Do not derive it from, or collapse it into, either of the two numbers it
  # sits beside: Deadline's "around three seconds" is how long burning Crew
  # must REMAIN in combat, and features.recall.channelTicks is a channel
  # length. Neither is a combat window.
  durationTicks: 140

# In-world selection: spending a progression choice requires a SPACE.
#
# Supersedes the chest menu as the in-match interaction. The menu still exists
# and /moba rewards still opens it; this is the mechanic that replaces it, and
# the two are not meant to both be live in a real match.
#
# See docs/design/IN_WORLD_SELECTION_AND_CHANNEL_CONDITIONS.md.
selection:
  # ON. This is the in-match progression path, and the chest menu it
  # supersedes is retired rather than kept as a fallback -- two ways to spend
  # a choice means the cheaper one is the real one, and the whole point of
  # this mechanic is that levelling costs a SPACE.
  #
  # /moba rewards still opens the chest, for inspecting the catalogue and for
  # use outside a match. It refuses while a match is running.
  enabled: true
  # [PROTOTYPE] The beat, not a channel. What matters is state at the END of
  # it, so spending the interval escaping and crouching on the final beat is
  # correct play. Independently tuned from combat.durationTicks -- that these
  # are 5s and 7s is a coincidence of first values, not a relationship.
  beatTicks: 100
  # The trailing window for "not moving". Instantaneous velocity is zero at odd
  # moments, so stillness needs a look-back or it means nothing. Measured in
  # whole blocks changed, the same reading Recall uses.
  stillnessTicks: 20
  # N is always three -- three Task trees, three ability branches. The required
  # width is DERIVED from this rather than fixed as a block span, so a future
  # two- or four-option choice does not silently break the space rule.
  slots: 3
  spacing: 1.0
  # How far ahead the options are placed. Against a wall the summon backs off
  # to the last clear block; in open air it uses the full reach.
  aimDistance: 4.0

mapStub:
  text: MOBA
  textX: 8
  textY: 60
  checkTicks: 20

provenance:
  sampleTicks: 200

# Regenerative Sources. The original seam shipped empty; the table below now
# supplies Alpha analytical fixtures. The plugin registers supplied sources and
# manages manifestations, not a generic Strategic Depth / Regional Character
# richness policy. Exact tiers/species/cadence remain OPEN; no density quota.
renewables:
  sampleTicks: 200
  # How often the opportunity lifecycle advances: recovery progress, and a
  # manifestation attempt when one is due.
  lifecycleTicks: 20
  # --- Temporal model -------------------------------------------------------
  # Everything here is a fraction of the Temporal Phase P (one day OR one
  # night), never a number of minutes. P has already changed once -- the clock
  # moved from a 6-minute phase to vanilla's 10-minute one -- and relationships
  # written in absolute minutes silently re-tune themselves when it does.
  #
  # ALL VALUES ARE WORKING CALIBRATION, NOT CANON. The night multiplier has two
  # live candidates (0.73 and 0.67) and neither is settled.
  temporal:
    # P itself. Defaults to the match clock's own phase, so it follows the clock
    # rather than asserting a second opinion about how long a day is.
    phaseTicks: 12000
    # First manifestation of a match. The regenerative economy is meant to
    # follow the opening rather than race it.
    initialFraction: 0.4
    # Recovery in daylight, after a manifestation is FULLY resolved.
    dayFraction: 0.33
    # Peaceful night recovery, relative to the daytime baseline. 0.73 is the
    # lighter candidate; 0.67 is the stronger alternative.
    nightRate: 0.73
    # Swarms are NOT assumed to follow the peaceful night slowdown: the design
    # direction is that they change at night rather than regenerate more slowly.
    # Exact nighttime Swarm behaviour is unresolved; 1.0 asserts nothing.
    swarmNightRate: 1.0
  # --- Eligibility: MINIMAL ALPHA FIXTURES ----------------------------------
  # These exist to exercise the architecture, not to settle what terrain suits
  # sheep or carrots. Exact predicates by resource kind are unresolved.
  eligibility:
    headroom: 2                 # air blocks needed above the ground block
    sampleStride: 4             # columns sampled inside the region
    minDisplacement: 12.0       # from the previous manifestation, so a region is not a camp
    playerExclusion: 24.0       # an opportunity is discovered, not materialised underfoot
    rejectPlayerPlaced: true    # Development can push a manifestation elsewhere in its region
    # Ground a wild manifestation may occupy. Read by BOTH the plugin and the
    # offline simulation in implementation/worldgen, because the simulation
    # reproduces this predicate and two copies of a rule drift. Edit here only.
    naturalGround:
      - grass_block
      - dirt
      - coarse_dirt
      - rooted_dirt
      - podzol
      - mycelium
      - moss_block
      - sand
      - red_sand
      - gravel
      - stone
      - snow_block
  # Half-span of the square region migrated from an authored origin+radius when
  # a source declares no explicit cells. A coarse search area, not a site.
  migratedRegionHalfSpan: 48
  patch:
    spread: 6                   # how far an irregular patch may wander from its locus
  herd:
    cluster: 5                  # how tightly members gather at the locus
  # Manifestation membership. A member that leaves its region stops being part
  # of the wild population and stays alive as an ordinary animal in the team's
  # economy -- it is never despawned, then or when the opportunity regenerates.
  #
  # UNRESOLVED: "left the region" is the narrowest defensible reading of when
  # captured livestock ceases to be wild. Whether capture should instead be
  # recognised by leashing, naming, fencing, or distance from the manifestation
  # site is a design decision. See
  # docs/proposals/2026-09-21-regenerative-opportunity-model.md D.1.
  membership:
    revokeOnLeavingRegion: true
  # Sources are the frozen Consolidative Alpha map's own authored placements:
  # renewable_range and founder_crop opportunities at authored coordinates.
  # Current authoring records them without prebuilding pens or irrigated fields. They bind to the match instance world, so they resolve only
  # once a match has opened and are rebuilt on reset.
  #
  # capacity and recoverTicks are NON-CANON ANALYTICAL FIXTURES: canon settles
  # that renewable sources deplete and recover, not the magnitudes.
  sources:
    rabbit_0_3:
      world: alpha_match
      type: ANIMAL
