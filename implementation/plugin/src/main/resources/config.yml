# Feature flags. Each Phase 2 feature is independently switchable; turning one
# off must never require touching another.
features:
  # Team-coloured GROUND inside each objective and Fountain volume.
  #
  # The glowing box cannot be read from inside it, and the ground around an
  # objective is exactly where a defender stands -- so the volume stays and the
  # representation changes. Minecraft already tints terrain per biome, which is
  # why a swamp does not look like a jungle, so this recolours by swapping the
  # biome rather than inventing a rendering path.
  #
  # The two tints are drawn from biomes the MAP DOES NOT CONTAIN, surveyed at
  # bind time: contrast has to be a property of the map rather than a guess, and
  # a tint matching nearby terrain communicates nothing. If fewer than two
  # candidates are free the feature declines rather than picking a colliding
  # colour.
  #
  # Only biome-tinted blocks change: grass, ferns, leaves, vines, sugar cane,
  # water. Dirt, stone and wood never will. Biome cells are 4x4x4, so the edge
  # snaps to a four-block grid.
  #
  # [OPEN] Biome carries mob spawns, weather and ambience, so this silently
  # changes what spawns on tinted ground. Absent biomes confine that rather than
  # removing it; a datapack biome overriding only colours, or per-viewer biome
  # packets, would remove it properly. OFF until that is resolved.
  objectiveTint:
    enabled: false
    # How far AROUND EACH VOLUME to survey, not a map-wide sweep. The tint has
    # to contrast with the terrain beside it; a biome 500 blocks away has no
    # bearing on whether an objective's ground reads as claimed. The first
    # version swept the whole map and forced thousands of synchronous chunk
    # loads, which stalled the server hard enough for Paper to dump threads.
    surveyRadius: 64
  # A team-coloured glow around each defensive objective and Aether Fountain,
  # so a player can tell by looking that they are one team system.
  #
  # Raised from the first live playtest: an authored Pillager Outpost read as
  # scenery, with nothing saying whose it was or that it was contestable.
  #
  # The body is a clear-glass block display scaled past the structure, because
  # the glow is traced from what the model RENDERS -- a display carrying an
  # invisible block produces no outline at all, so there is no
  # invisible-but-outlined form to configure. A purpose-built wireframe item
  # model is the intended successor.
  #
  # Colours are ChatColor names, because the glow resolves through a scoreboard
  # team and that is the palette a team colour has. Arbitrary RGB would need
  # per-player packet work.
  #
  # NO RADIUS KEY, deliberately. Range is DEFERRED by design decision -- it is
  # the vision/information question rather than a presentation setting, and
  # entity tracking range is the de facto limit until it is taken up. Do not
  # add one here without resolving that.
  objectiveGlow:
    enabled: false
    colour:
      north: AQUA
      south: RED
  # The Aether Fountain restores its own team's Health and Hunger.
  #
  # Only a team's own Fountain restores that team, and a disabled Fountain
  # restores nothing, so recovery follows the respawn role rather than turning
  # the structure into a contestable heal pad. Radius and rates are NON-CANON
  # ALPHA FIXTURES; canon fixes the Fountain's relationship to respawning, not
  # how fast standing in one heals.
  fountainRegen:
    enabled: true
    intervalTicks: 20
    radius: 8.0
    healthPerInterval: 1.0
    foodPerInterval: 1
    # A player reappears reconstructing, not restored.
    respawnHealth: 1.0
    respawnFood: 1
  # Work Points: gameplay-driven progression. Only domains whose contribution
  # rule is specified enough to implement are wired; see
  # docs/analysis/alpha-0.1-progression.md.
  workPoints: { enabled: true, announce: true }
  # The plugin draws the Hunger readout because the vanilla row cannot
  # distinguish an empty drumstick from one beyond the player's Capacity.
  # Requires the resource pack, which blanks the vanilla row; without it the
  # glyphs are unmapped and the readout is unreadable.
  # Retired: the native hunger row is repainted as a bar by the pack, in its own
  # HUD position, so a parallel boss-bar readout is no longer what makes hunger
  # legible. Left switchable rather than deleted until the bar is judged in play.
  hungerDisplay: { enabled: false, refreshTicks: 10 }
  # Health regeneration relative to maximum Hunger. Vanilla requires food >= 18
  # to regenerate, and Capacity caps food at effectiveHunger, which starts at 9,
  # so vanilla regeneration can never fire on the canonical curve.
  #
  # Two empty drumsticks block regeneration. A drumstick is two food points, so
  # regeneration stops once 4 or more points are missing: at a maximum of 20
  # that blocks at 16, eight drumsticks or fewer, and permits from 17 up.
  #
  # Named for the BLOCKING condition on purpose. "Four below maximum" and
  # "eight or fewer drumsticks" differ by one point depending on which side the
  # comparison sits, and that is easy to encode backwards.
  #
  # The 6-food sprint cutoff is vanilla and is deliberately NOT reimplemented.
  hungerRegen:
    enabled: true
    blockedWhenPointsMissing: 4
    intervalTicks: 80
    healAmount: 1.0
    exhaustionPerHeal: 6.0
  lockedSlots:
    enabled: true
    # Must be unobtainable in survival: a material a player can hold would let
    # vanilla merge a pickup into the marker stack. BARRIER also reads as
    # blocked with no resource pack, and a pack can give it a subtle
    # slot-shaped texture instead.
    material: BARRIER
    label: "Locked slot"
    refreshTicks: 20
  contributions:
    enabled: true
  durability:
    enabled: true
  hubLobby:
    enabled: true
    originX: 0
    originY: 65
    originZ: 0
    spacing: 8
    floorMaterial: POLISHED_DEEPSLATE
    frameMaterial: POLISHED_BLACKSTONE_BRICKS
    cooldownMillis: 3000
    # Ships EMPTY. Which maps are offered is a selection decision, not a
    # plugin default. Each entry needs a label and the command to run.
    # Example, using the terrain gallery's own navigation:
    #   candidate_a:
    #     label: "930012642"
    #     command: "function harvest:visit/tv_ef56852eda10acc88342e5ee"
    destinations: {}
  rewardAdvancements:
    enabled: true
  infraMode:
    enabled: true
  routes:
    enabled: true
    minLength: 16.0            # endpoints closer than this are refused
    sampleEveryBlocks: 4.0
    maxSamples: 512
    keepEverySample: 2         # coarse retention; canon leaves geometry OPEN
    maxDesignationTicks: 24000
    corridorRadius: 6.0
    effectTicks: 20
    exhaustionRelief: 0.1      # sprint efficiency, never added speed
  # Mark the renewable resources THEMSELVES, not the region they sit in.
  #
  # This replaces a ring of particles drawn at the source's radius: a 40-block
  # circle at one fixed height, which answered "a source is somewhere around
  # here". Animals move, so a fixed ring stops describing a herd the moment it
  # wanders, and what a player has to recognise is the sheep rather than the pen.
  #
  # Animals and swarms GLOW -- a silhouette that tracks the entity, which no
  # particle emitter can do. Crops get a particle per qualifying block, because
  # blocks cannot glow. A depleted source marks nothing, so a mark means
  # "available" and not merely "exists".
  #
  # Glow renders through terrain, but NOT across the map: a client is never sent
  # an entity outside its tracking range, so the real exposure is spigot.yml's
  # entity-tracking-range.animals, 96 blocks here. It is not public information.
  #
  # Marking is therefore tuned for LEGIBILITY rather than concealment. Two
  # opposing players meeting at the same herd already implies one of them is in
  # contested or enemy ground, and at that range hiding the herd solves nothing
  # while costing every player the clarity the mark exists for.
  #
  # viewRadius is measured from the source centre and the source's own radius is
  # added to it, so 32 lights a 20-radius pen when a player is about 32 blocks
  # from its edge: close enough to be working it. It must stay well inside the
  # tracking range above, or the gate stops gating anything.
  # A player who is not a living participant of a RUNNING match takes no damage,
  # loses no hunger and is not targeted. Waiting to join is not gameplay, and
  # dying to a creeper on the way to the lobby is an interruption of the one
  # thing the player is trying to do.
  # Health and hunger as fixed-length bars.
  #
  # The bar is always twenty points -- ten hearts, ten drumsticks -- for every
  # player, and Capacity decides what a point is WORTH rather than how many
  # there are. A hit of 3 against Capacity 9 removes a third of the player
  # either way; what changes is that the bar stops shrinking, so a level-one
  # player no longer looks at a half-length health bar.
  #
  # For hunger this also dissolves the unreachable-drumstick problem outright:
  # Capacity becomes an exhaustion RATE, the row fills completely, and a smaller
  # Capacity simply empties it faster.
  #
  # naturalRegeneration is held OFF on purpose. Vanilla regen needs food >= 18,
  # which a Hunger Capacity of 9 made unreachable, so it has never fired and
  # HungerRegen was written to be the rule instead. Uncapping hunger would
  # switch vanilla's on as a side effect of a display change; that is a design
  # decision and is not taken here.
  vitalsScaling:
    enabled: true
    sampleTicks: 2
    naturalRegeneration: false
  lobbySafety:
    enabled: true
  # A dedicated lobby world, built rather than generated.
  #
  # The lobby used to be the server's default world: a vanilla superflat with a
  # vanilla village in it, which nobody authored and nobody chose. It also meant
  # the lobby shared a world with the terrain gallery, so "make the lobby safe"
  # could only be a listener cancelling damage -- setting that world peaceful
  # would have decided mob spawning and sleeping for the gallery too.
  #
  # Its own world makes the safety structural instead: nothing spawns, the
  # weather never changes, the sun never sets, and the room has no exit.
  #
  # Materials are a GREYBOX. Extent, enclosure and lighting are function and are
  # decided in code; what the room looks like is a design decision and is not.
  lobbyWorld:
    enabled: true
    name: moba_lobby
    radius: 16              # interior half-span, so the hall is 33 across
    floorY: 64
    height: 8               # interior headroom
    lightSpacing: 6
    sendOnJoin: true
    adventureMode: true
    floorMaterial: SMOOTH_STONE
    wallMaterial: STONE_BRICKS
    ceilingMaterial: STONE_BRICKS
    lightMaterial: SEA_LANTERN
    platformMaterial: POLISHED_ANDESITE
  renewableMarkers:
    enabled: true
    ticks: 20
    # Nothing is marked unless a player is within this range of the source.
    viewRadius: 32.0
    # Crop membership costs an O(radius^3) volume scan, so it is cached and
    # refreshed on this cadence rather than every tick.
    rescanTicks: 200
  renewableAuthoring:
    enabled: true
    reach: 48
    defaultRadius: 3
    defaultCapacity: 5
    recoverTicks: 200
  hud:
    enabled: true
    refreshTicks: 20
  taskProgression:
    enabled: true
  sentinelSkull:
    # Superseded by the tome while features.tome.enabled is true. Kept as the
    # fallback representation: a separate skull carrying the sentinel identity,
    # with no map surface.
    enabled: true
    material: SKELETON_SKULL
  # The server hands every arriving player the pack.
  #
  # It has to: the plugin blanks vanilla sprites and draws replacements from
  # private-use codepoints, so a client without the pack sees missing hunger
  # icons and tofu rather than a degraded version of the intended HUD. Before
  # this, build_pack.py wrote to wherever --output pointed and nothing ever put
  # the result in front of a client at all.
  #
  # sha1 is written by implementation/resourcepack/publish.py, which builds the
  # zip and the hash together. Clients cache by hash, so a rebuilt pack with a
  # stale hash is silently not applied -- a failure that looks exactly like the
  # pack not working.
  resourcePack:
    enabled: true
    url: "http://127.0.0.1:25580/moba-pack.zip"
    sha1: ""
    required: false
    prompt: "Minecraft MOBA uses a resource pack for its HUD."
  # PROBE, not a feature. Overrides the tome's GUI model with a scaled, offset
  # placeholder that should overflow the offhand slot to the LEFT, into the
  # empty HUD space beside it.
  #
  # It answers two questions: whether art can be placed at that exact position
  # at all -- glyphs can only sit on the action bar line above the hotbar -- and
  # whether overriding the item's model SUPPRESSES THE CORNER MINIMAP, which
  # renders because a FILLED_MAP is in the offhand. If the minimap dies, the
  # tome cannot carry an ability row and the row goes to glyphs instead.
  #
  # Off by default: it visibly changes the tome and is meant to be looked at
  # once and then decided, not left running.
  abilityPanelProbe:
    enabled: false
    itemModel: "moba:ability_panel"
  # The tome: ONE offhand item that is the sentinel, the class text and the map.
  #
  # SPEC section 11 requires the offhand item to be a FILLED_MAP from the start,
  # which is exactly what makes this possible: identity lives in persistent
  # data, the class blurb lives in name and lore, and the map view is the
  # minimap surface. The skull's appearance is the only thing given up, and a
  # resource pack can restyle the map item's icon.
  tome:
    enabled: true
  # The minimap drawn on the tome's surface. Every pixel is computed by
  # Minimap; vanilla tracking is off so no map terrain draws underneath.
  # Disabled, this falls back to the stub renderer rather than to vanilla.
  minimap:
    enabled: true
    blocksPerPixel: 4        # 128px surface, so 4 gives ~512 blocks of coverage
    terrainRefreshTicks: 40  # sampling 16k columns per frame is not affordable
    playerRange: 256.0
  # Recall, begun by lifting the tome out of the offhand slot in the inventory.
  # The gesture is deliberate and already dangerous in a fight, so unlike a
  # keybind it cannot fire by accident; the tome is never actually removed.
  #
  # channelTicks and moveTolerance are NON-CANON ALPHA FIXTURES.
  recall:
    enabled: true
    channelTicks: 100        # 5s
    moveTolerance: 1.5
    # Destination resolves to the player's own Aether Fountain during a match
    # (ALPHA-D3/D4 make the homeland the Fountain). Set destination.x/y/z to
    # override; fallbackToWorldSpawn applies only outside a match.
    fallbackToWorldSpawn: true
  # Defined at their CURRENT LIVE VALUES so the file stops disagreeing with the
  # code. These read as disabled today because the keys were absent and the
  # Java fallback is false -- writing them down changes nothing and is not an
  # endorsement of the value. Flip deliberately, not by discovering them.
  healthDisplay:
    enabled: false
    refreshTicks: 10
  pings:
    enabled: false
    cooldownMillis: 1500
    audienceRadius: 96.0
    markerSeconds: 8
  testbed:
    enabled: false
    constructsArePlayerPlaced: false

durability:
  targetBaseUses: {}

classes:
  test:
    # Eligibility is AUTHORED PER CLASS and may be asymmetric: several options,
    # one, or none. It is not inherited from archetype tags. The full class x
    # infrastructure matrix is [OPEN]; the discussion examples are Mole with
    # Route/Construct and Kitfighter with Monster Combat only, and neither is
    # settled. The harness class gets a deliberately mixed set for testing.
    infrastructureEligibility:
      - ROUTE
      - CONSTRUCT
      - MONSTER_COMBAT
    displayName: "Test Class"
    tomeName: "Tome of the Test Class"
    blurb:
      - "Harness class. Not a design."
      - "F = A1   Sneak+F = A2   Sprint+F = channel ult"
      - "Drop = ultimate. Swap again to stop casting."

# Prototype parameters, not final balance. Paper 1.21.11 / Java 21.
progression:
  maxLevel: 30
  # Retained as the fallback when a level falls outside every band.
  xpPerLevel: 100
  # WP required to leave each level.
  #
  #     cost(b, i) = 300 * bandMultiplier[b] * 1.15^i
  #
  # where b is the economic band and i counts advancements WITHIN that band
  # from 0. The band multipliers are the established relative requirement
  # indices and are unchanged:
  #
  #     Bootstrap 1.000  Established 1.350  Developed 1.875
  #     Advanced  2.575  Endgame     3.250
  #
  # The 300 baseline and the 1.15 in-band factor are WORKING ALPHA
  # CALIBRATION, not canon. Values are rounded to convenient 5-WP steps.
  #
  # The requirement DROPS at each band boundary, which is intentional and not a
  # rounding artefact: each economic phase restarts from its own multiplier and
  # then compounds within itself, so entering a new phase is a step down in
  # per-level cost and a step up in the cost the phase will reach.
  levelCosts:
    # Bootstrap (x1.000)
    "1": 300
    "2": 345
    "3": 395
    "4": 455
    "5": 525
    "6": 605
    # Established (x1.350)
    "7": 405
    "8": 465
    "9": 535
    "10": 615
    "11": 710
    "12": 815
    # Developed (x1.875)
    "13": 560
    "14": 645
    "15": 745
    "16": 855
    "17": 985
    "18": 1130
    "19": 1300
    # Advanced (x2.575)
    "20": 770
    "21": 890
    "22": 1020
    "23": 1175
    "24": 1350
    # Endgame (x3.250)
    "25": 975
    "26": 1120
    "27": 1290
    "28": 1485
    "29": 1705
    # Lv30 is the cap; there is no cost to leave it.
  # The band each level belongs to, kept so the curve can be checked against
  # the formula that generated it rather than only against itself.
  bandMultipliers:
    bootstrap: 1.000
    established: 1.350
    developed: 1.875
    advanced: 2.575
    endgame: 3.250
  # WP per recognized action, all under progression.work.* so that every key
  # the plugin reads is the key this file defines.
  #
  # RESOLUTION. These were calibrated against a 40-WP level and are now scaled
  # for a 300-WP one. The point of the higher resolution is NOT a flat 10x: it
  # is that 1 WP can stay the minimum accounting unit for a genuinely small
  # action while materially significant work moves into the tens. So the scale
  # is applied to substantive work and deliberately not to the small end --
  # production utility stays at 1, and consumables sit below 10x because they
  # arrive in stacks.
  #
  # Every number below is a NON-CANON ALPHA FIXTURE.
  work:
    # -- Construction ---------------------------------------------------
    # 1 WP is the ATOMIC Work Point: the smallest legible unit of progression,
    # not an exceptional or provisional value. Placing a block is mundane
    # legitimate Minecraft activity and earns exactly one of those.
    #
    # Mundane work is not supposed to become worthless -- it is supposed to
    # become insufficient. That job belongs to the level-cost curve, where a
    # 1 WP placement is 1/300th of a Bootstrap level and 1/1705th of an Endgame
    # one. Setting the award to 0 would have made the same point by deleting the
    # activity from the economy instead of by pricing it, which is a different
    # and worse claim.
    #
    # What stops this being a farm is the anti-recycling rule, not the
    # magnitude: credit attaches to a block POSITION a player has not built at
    # before, so place -> break -> place pays once. See ConstructionWorkTest.
    constructionBlockPlacement: 20
    ordinaryPlacement: 1          # the atomic Work Point
    # -- Extraction: WP = A(O) + qH -------------------------------------
    #
    # Rescaled into the new resolution, NOT replaced by a flat per-ore award.
    # A(O) credits exploiting one physical opportunity and is paid once per ore
    # block broken; H is the qualifying harvest actually obtained, read from the
    # real drops; q converts it to points. Fortune therefore still raises H and
    # never A(O), and raising q with A keeps Yield worth the same fraction of a
    # break as before rather than quietly demoting it.
    #
    # The q=10 flat coefficient keeps the known asymmetry it had at q=1:
    # multi-drop ores (redstone 4-5, lapis 4-9, copper 2-5) accrue more harvest
    # WP than single-drop ores. That is a calibration question rather than a
    # model question, and per-ore q would be a new design decision, so it is
    # still flagged rather than tuned away.
    extraction:
      # q, the harvest coefficient. Per ore kind, because a single flat q made
      # the harvest term proportional to an ore's DROP COUNT, which is a
      # property of the block and not of the work. Breaking one copper ore is
      # the same physical act as breaking one coal ore, but copper drops 2-5
      # raw copper, so at a flat q=10 one copper block paid 45 WP against
      # coal's 20 -- and very nearly as much as a diamond block's 50.
      #
      # Live evidence (2026-09-21): 30 copper blocks produced 1,250 WP, 56% of
      # a 2,220 WP expedition, from 25% of the blocks broken.
      #
      # The rule is q ~= 10 / expected drops, so a block of any ore yields
      # roughly the same harvest WP for the same act. Fortune still raises H
      # and still pays; what changed is that yield is now measured against what
      # the ore normally gives rather than against a flat scale.
      harvestCoefficient: 10        # single-drop default
      harvest:
        copper: 3                   # 2-5 raw copper per block
        redstone: 2                 # 4-5
        lapis: 2                    # 4-9
      silkTouchHarvest: 0           # UNRESOLVED: whether deferral is harvest
      opportunity:
        default: 0
        coal: 10
        copper: 10
        iron: 20
        gold: 30
        redstone: 20
        lapis: 20
        diamond: 40
        emerald: 40
        ancient_debris: 60
    # -- Production: WP_P = A(P) + qQ ------------------------------------
    #
    # A(P) is the UNDERTAKING -- the value of performing a meaningful
    # transformation at all -- paid once per output type per match. perOutput is
    # the marginal value of each additional unit.
    #
    # Purely linear per-output value made bulk consumables behave like capital:
    # in live play 48 loaves of bread paid 288 WP against 160 for a full set of
    # copper armour, and 27 smelted ingots paid 540. That says producing bread
    # at scale is the same KIND of accomplishment as equipping a player and
    # merely more of it.
    #
    # The split is general rather than a bread exception, and discrete durables
    # come out ahead without being special-cased: a pickaxe is one undertaking
    # for one item, so A(P) dominates it, while a hundred loaves asymptote to
    # perOutput. It is also the shape the other domains already use --
    # Construction pays per new position, Exploration per first resolution -- so
    # "the first time is worth more than the repetition" is now one idea rather
    # than three.
    #
    # Categories are enumerated in ProductionRecipes; a recipe outside them is
    # UNRESOLVED and pays nothing rather than being guessed at. Storage-block
    # compression pays nothing in the crafting direction, which is what stops
    # ingot <-> block from being an unbounded loop.
    production:
      tool:               { undertaking: 30, perOutput: 1 }
      equipment:          { undertaking: 40, perOutput: 2 }
      utility:            { undertaking: 10, perOutput: 1 }
      consumable:         { undertaking: 20, perOutput: 1 }
      strategic_input:    { undertaking: 20, perOutput: 2 }
      construction_block: { undertaking: 20, perOutput: 2 }
    # -- Development: improved productive renewable state ----------------
    # Both events are gated by real time (a breeding cooldown, a growth cycle)
    # rather than by a cooldown imposed here.
    development:
      breeding: 80
      matureCropHarvest: 20
    # -- Exploration: novel Reach ----------------------------------------
    # Credited once per player per registered Worksite per match. Distance
    # walked, chunks entered and re-crossed geography pay nothing.
    exploration:
      siteResolved: 60
      radius: 24.0
      intervalTicks: 20
  task:
    tierMax: 3
    efficiencyPerTier: 0.30      # BLOCK_BREAK_SPEED multiplier per tier
    damagePerTier: 1.0           # flat ATTACK_DAMAGE per tier
    yieldExtraChancePerTier: 0.25
    # Efficiency covers Unbreaking as well as block-breaking speed.
    efficiencyGrantsUnbreaking: true
    # Canon cadence: L4 Efficiency I universal, L7 Yield I universal,
    # then a choice at L9, L14 and L19. Automatic grants:
    automatic:
      4: { domain: EFFICIENCY, tier: 1 }
      7: { domain: YIELD, tier: 1 }
  # The Level 6 fork: one class-compatible Infrastructure form, or Monster Combat.
  contributionForkLevel: 6

# Equipment wear. Follows the family-wide doctrine in manuscript 15.1.2:
#     L_e = D_e * U_e / R_e
# expected useful lifetime = base durability * Unbreaking multiplier /
# consumption rate under that category's workload. Identity belongs to the
# material FAMILY, so targets are per material and per equipment category
# rather than one number per material.
#
# Ladder: Wood temporary -> Stone disposable -> Copper replaceable legitimate
# equipment -> Iron reliable -> Diamond capital -> Netherite premier.
# Copper became a Primary Material on 19 September 2026.
#
# Ships EMPTY, which is vanilla. 15.1.1 is labelled a NON-CANON BALANCE-TEST
# CANDIDATE and exact values remain OPEN, so its numbers are commented below
# rather than defaulted. Uncomment to run the sensitivity test.
#
# Unbreaking needs no coefficient: vanilla's 1/(level+1) already reproduces the
# 15.1.1 column, with Iron 96 reaching ~192, ~288 and ~384 at Unbreaking I-III.
#
# durability:
#   targetBaseUses:
#     wood:   { tool: 16 }
#     stone:  { tool: 36 }
#     copper: { tool: 60 }
#     iron:   { tool: 96 }
capacity:
  enforceTicks: 1
  health: { start: 9, growthUnit: 1, cap: 20 }
  hunger: { start: 9, growthUnit: 1, cap: 20 }
  slots: { start: 6, growthUnit: 3, cap: 36 }
  growthLevels: [2, 4, 7, 8, 9, 11, 13, 14, 15, 16, 17]
rewards:
  levels: {}
  toast: { fadeInTicks: 5, stayTicks: 30, fadeOutTicks: 10 }
abilities:
  bindings:
    mode: SWAP_HAND
    a1: LEFT_CLICK
    a2: RIGHT_CLICK
    ult: DROP
  modeTimeoutTicks: 50
  # Level at which each slot becomes usable, from the classes.md working
  # breakpoint table: Ability 1 at 1, Ability 2 at 2, Ultimate at 15. The
  # Ultimate's timing is recorded there as unresolved, so 15 is that table's
  # working value rather than a decision taken in code.
  unlockLevels: { a1: 1, a2: 2, ult: 15 }
  logExecutions: true
  # User-authorized prototype test kit. Not class design or balance canon.
  classes:
    test: { a1: lunge, a2: sinkhole_lite, ult: channel_ult }
    lightfooted:
      displayName: Lightfooted
      passiveHook: animal_senses
      statGrowthProfile: lightfooted
      infrastructureProgression: { level6: routes, level12: traversal_expression }
      branches: { lunge: swarming_bite }
      persistentStateDefaults: { lungeBranch: swarming_bite }
      a1: lunge
      a2: sinkhole_lite
