# The ability skeleton: every designed class, every slot, and what is declared.
#
# THIS IS NOT LOADED BY THE PLUGIN. It lives under src/test/resources
# deliberately, because config.yml already records the decision this file would
# otherwise break:
#
#   "An unbound input does nothing, which is honest; a placeholder would be a
#    lie that looked like a feature."
#
# So the skeleton is a DESIGN MANIFEST, read only by AbilitySkeletonTest. It
# gives every class a named slot and a stable id without giving any class a
# half-built ability that a player could press.
#
# status:
#   built       an Ability implementation exists and declares its outputs
#   dispatched  a passive with a live listener; no Ability, so no outputs
#   declared    config names a passiveHook that NOTHING dispatches. Kept as a
#               status because three hooks were in this state on 8 October 2026
#               and none is now; PassiveHookDispatchTest fails if one returns.
#   designed    classes.md has the kit; nothing is implemented
#
# affects:
#   Who the output acts on: NONE, ENEMIES, ALLIES, BOTH, or "?". It is a
#   SEPARATE question from target and from combat-ness, and derivable from
#   neither: Crash Landing is SELF and damages nearby enemies, while Deathly
#   Clutches declares combat: true and touches nobody but the caster.
#
#   A passive is NONE here by the same reasoning that makes it SELF/PASSIVE:
#   this axis describes an output's reach, and nothing in the roster's passives
#   reaches another player. The first that does should say so.
#
#   Recorded per output, which a one-row-per-slot manifest cannot fully express:
#   Runway is NONE on two branches and ENEMIES on Suplex. The row carries the
#   BASE, and Ability.outputs(player, context) is the authority with a branch
#   in hand. Anything reading this file for worst-case coverage must know that.
#
# target / input:
#   One of TargetForm / InputForm, or "?" for a question classes.md has not
#   answered. "?" is legal ONLY while status is designed -- the test refuses a
#   built ability that has not said. Guessing a form from an ability's NAME is
#   how a wrong answer gets laundered into a decision, so unanswered cells stay
#   unanswered.
#
# A passive is the one form that is determined without reading further: it has
# no gesture, so it permits no cast mode, and that is a different statement
# from "every mode applies".

classes:
